<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض توزيع الكشف</title>
<link rel="icon" href="logo.png">

<style>
:root{--blue:#005b9f;--blue2:#0077c8;--line:#e2e8f0}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial;
  background:linear-gradient(180deg,#f8fbff,#eef4f9);
}

.topbar{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;
  padding:18px;
  display:flex;
  justify-content:space-between;
  border-bottom-left-radius:25px;
}

.main{
  width:94%;
  max-width:1200px;
  margin:20px auto;
}

.sections{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.panel{
  background:#fff;
  border-radius:20px;
  border:1px solid var(--line);
  overflow:hidden;
}

.panel-head{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;
  padding:12px;
  display:flex;
  justify-content:space-between;
}

.panel-body{padding:12px}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:10px;
}

.stat{
  background:#f8fbff;
  border:1px solid var(--line);
  border-radius:10px;
  text-align:center;
  padding:8px;
}

.stat span{font-size:18px;display:block}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th{
  background:#06345d;
  color:#fff;
  font-size:11px;
  padding:6px;
}

td{
  border:1px solid #e2e8f0;
  font-size:11px;
  padding:6px;
  text-align:center;
}

.badge{
  padding:3px 6px;
  border-radius:999px;
  font-size:10px;
}

.green{background:#dcfce7}
.yellow{background:#fef3c7}
.gray{background:#e5e7eb}

.history{
  margin-top:15px;
  background:#fff;
  padding:12px;
  border-radius:20px;
  border:1px solid var(--line);
}

.reset{
  background:#dcfce7;
  font-weight:bold;
}

@media(max-width:900px){
  .sections{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="topbar">
  <div>عرض توزيع الكشف</div>
  <button onclick="location.href='index.html'">الرئيسية</button>
</div>

<div class="main">

<div class="sections">

<!-- رجال -->
<div class="panel">
  <div class="panel-head">
    <span>قسم الرجال</span>
    <span id="menNext">—</span>
  </div>
  <div class="panel-body">

    <div class="stats">
      <div class="stat">الإجمالي <span id="menTotal">0</span></div>
      <div class="stat">بالدور <span id="menQueue">0</span></div>
      <div class="stat">بالاسم <span id="menName">0</span></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>الأخصائي</th>
          <th>الإجمالي</th>
          <th>الحالة</th>
        </tr>
      </thead>
      <tbody id="menTable"></tbody>
    </table>

  </div>
</div>

<!-- نساء -->
<div class="panel">
  <div class="panel-head">
    <span>قسم النساء</span>
    <span id="womenNext">—</span>
  </div>
  <div class="panel-body">

    <div class="stats">
      <div class="stat">الإجمالي <span id="womenTotal">0</span></div>
      <div class="stat">بالدور <span id="womenQueue">0</span></div>
      <div class="stat">بالاسم <span id="womenName">0</span></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>الأخصائي</th>
          <th>الإجمالي</th>
          <th>الحالة</th>
        </tr>
      </thead>
      <tbody id="womenTable"></tbody>
    </table>

  </div>
</div>

</div>

<div class="history">
  <h3>السجل</h3>
  <table>
    <thead>
      <tr>
        <th>التاريخ</th>
        <th>القسم</th>
        <th>التفاصيل</th>
      </tr>
    </thead>
    <tbody id="log"></tbody>
  </table>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSy...",
  authDomain:"akazcenter-89c17.firebaseapp.com",
  projectId:"akazcenter-89c17"
});

const db=getFirestore(app);
const ref=collection(db,"newAssessments");

const menList=[
"د: حاتم الاحمدي",
"د: عبدالرحمن السويداء",
"د: عبدالرحمن السليمي",
"د: عبدالعزيز الحمدان"
];

const womenList=[
"د: ريناد حميد",
"د: ابتسام سويلم",
"د: سلمى فرحان",
"د: أسماء فهيد",
"د: هند فهيد",
"د: مها فريح"
];

let data=[];

onSnapshot(ref,snap=>{
  data=[];
  snap.forEach(d=>data.push(d.data()));
  render();
});

function same(a,b){
  return (a||"").replace(/\s/g,"") === (b||"").replace(/\s/g,"");
}

function render(){

  const men=data.filter(x=>x.section==="men" && x.recordType==="assessment");
  const women=data.filter(x=>x.section==="women" && x.recordType==="assessment");

  menTotal.innerText=men.length;
  womenTotal.innerText=women.length;

  menQueue.innerText=men.filter(x=>x.method==="queue").length;
  womenQueue.innerText=women.filter(x=>x.method==="queue").length;

  menName.innerText=men.filter(x=>x.method==="name").length;
  womenName.innerText=women.filter(x=>x.method==="name").length;

  fillTable("men",menList,men,"menTable");
  fillTable("women",womenList,women,"womenTable");

  renderLog();
}

function fillTable(section,list,items,id){
  const box=document.getElementById(id);
  box.innerHTML="";

  list.forEach(name=>{
    const total=items.filter(x=>same(x.therapist,name)).length;

    const suspended=data.find(x=>
      x.recordType==="suspension" &&
      same(x.therapist,name)
    );

    let status="";

    if(suspended){
      status=`<span class="badge gray">موقوف</span>`;
    }else if(total===0){
      status=`<span class="badge green">أولوية</span>`;
    }else{
      status=`<span class="badge yellow">متاح</span>`;
    }

    box.innerHTML+=`
      <tr>
        <td>${name}</td>
        <td>${total}</td>
        <td>${status}</td>
      </tr>
    `;
  });
}

function renderLog(){
  log.innerHTML="";

  data.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  data.forEach(x=>{

    if(x.recordType==="balanceReset"){
      log.innerHTML+=`<tr class="reset"><td colspan="3">تم التوازن وإعادة التوزيع</td></tr>`;
      return;
    }

    let text="";

    if(x.recordType==="assessment"){
      text=`${x.patient} - ${x.therapist}`;
    }

    if(x.recordType==="skip"){
      text=`تجاوز ${x.therapist}`;
    }

    if(x.recordType==="suspension"){
      text=`إيقاف ${x.therapist}`;
    }

    log.innerHTML+=`
      <tr>
        <td>${x.date || ""}</td>
        <td>${x.section==="men"?"رجال":"نساء"}</td>
        <td>${text}</td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
