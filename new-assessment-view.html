<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض توزيع الكشف</title>
<link rel="icon" href="logo.png">

<style>
:root{
  --blue:#005b9f;
  --blue2:#0077c8;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial;
  background:linear-gradient(180deg,#f8fbff,#eef4f9);
  color:var(--text);
}

/* الهيدر */
.topbar{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  padding:20px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom-left-radius:28px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:60px;
  height:60px;
  background:white;
  border-radius:14px;
  padding:5px;
}

.brand h1{
  margin:0;
  font-size:22px;
  font-weight:900;
}

.btn{
  background:white;
  color:var(--blue);
  border:none;
  padding:10px 16px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

/* الصفحة */
.main{
  width:95%;
  max-width:1300px;
  margin:25px auto;
}

/* الأقسام */
.sections{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.panel{
  background:white;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
}

/* رأس القسم */
.panel-head{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  padding:16px;
  display:flex;
  justify-content:space-between;
  font-weight:900;
  font-size:16px;
}

/* التنبيه */
.fair-box{
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#92400e;
  border-radius:14px;
  padding:12px;
  margin-bottom:14px;
  text-align:center;
  font-weight:900;
  font-size:14px;
}

.balance-ok{
  background:#dcfce7!important;
  border-color:#86efac!important;
  color:#166534!important;
}

/* الجدول */
.table-wrap{
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th{
  background:#06345d;
  color:white;
  padding:12px;
  font-size:14px;
}

td{
  border:1px solid #e2e8f0;
  padding:12px;
  text-align:center;
  font-size:14px;
}

/* اسم الدكتور */
td:first-child{
  font-size:16px;
  font-weight:900;
}

/* الحالات */
.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
}

.green{background:#dcfce7;color:#166534}
.blue{background:#dbeafe;color:#1d4ed8}
.red{background:#fee2e2;color:#b91c1c}
.gray{background:#e5e7eb;color:#374151}
.orange{background:#ffedd5;color:#9a3412}

/* السجل */
.history{
  margin-top:20px;
  background:white;
  border-radius:24px;
  padding:16px;
  border:1px solid var(--line);
}

.history h3{
  margin:0 0 12px;
  color:var(--blue);
}

.reset{
  background:#dcfce7;
  font-weight:bold;
}

.suspend{
  background:#fef3c7;
  font-weight:bold;
}

.opening{
  background:#eef6ff;
  font-weight:bold;
}

.empty{
  color:#94a3b8;
  font-weight:900;
}

/* موبايل */
@media(max-width:900px){
  .sections{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">
    <img src="logo.png" class="logo">
    <h1>عرض توزيع الكشف</h1>
  </div>
  <button class="btn" onclick="location.href='index.html'">الرئيسية</button>
</div>

<div class="main">

<div class="sections">

<!-- رجال -->
<div class="panel">
  <div class="panel-head">
    <span>قسم الرجال</span>
    <span id="menNext">—</span>
  </div>

  <div class="panel-body">

    <div class="fair-box" id="menFairNote">—</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الأخصائي</th>
            <th>الإجمالي</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="menTable"></tbody>
      </table>
    </div>

  </div>
</div>

<!-- نساء -->
<div class="panel">
  <div class="panel-head">
    <span>قسم النساء</span>
    <span id="womenNext">—</span>
  </div>

  <div class="panel-body">

    <div class="fair-box" id="womenFairNote">—</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الأخصائي</th>
            <th>الإجمالي</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="womenTable"></tbody>
      </table>
    </div>

  </div>
</div>

</div>

<!-- السجل -->
<div class="history">
  <h3>السجل</h3>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>القسم</th>
          <th>التفاصيل</th>
        </tr>
      </thead>
      <tbody id="log"></tbody>
    </table>
  </div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSy...",
  authDomain:"akazcenter-89c17.firebaseapp.com",
  projectId:"akazcenter-89c17"
});

const db=getFirestore(app);
const ref=collection(db,"newAssessments");

let data=[];

onSnapshot(ref,snap=>{
  data=[];
  snap.forEach(d=>data.push(d.data()));
  render();
});

function render(){

  const men=data.filter(x=>x.section==="men" && x.recordType==="assessment");
  const women=data.filter(x=>x.section==="women" && x.recordType==="assessment");

  document.getElementById("menNext").innerText = men.length ? men[men.length-1].therapist : "—";
  document.getElementById("womenNext").innerText = women.length ? women[women.length-1].therapist : "—";

  renderTable("menTable", men);
  renderTable("womenTable", women);

  renderLog();
}

function renderTable(id, list){
  const table=document.getElementById(id);
  table.innerHTML="";

  const counts={};

  list.forEach(x=>{
    counts[x.therapist]=(counts[x.therapist]||0)+1;
  });

  Object.keys(counts).forEach(name=>{
    table.innerHTML+=`
      <tr>
        <td>${name}</td>
        <td>${counts[name]}</td>
        <td><span class="badge green">نشط</span></td>
      </tr>
    `;
  });
}

function renderLog(){
  const log=document.getElementById("log");
  log.innerHTML="";

  data.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  data.forEach(x=>{
    let text="";

    if(x.recordType==="assessment"){
      text=`${x.patient} - ${x.therapist}`;
    }
    if(x.recordType==="skip"){
      text=`تم التجاوز حسب طلب الأخصائي`;
    }
    if(x.recordType==="suspension"){
      text=`متوقف عن استقبال الكشف حتى ${x.untilDate}`;
    }
    if(x.recordType==="balanceReset"){
      log.innerHTML+=`<tr class="reset"><td colspan="3">تم تحقيق التوازن</td></tr>`;
      return;
    }

    log.innerHTML+=`
      <tr>
        <td>${x.date || ""}</td>
        <td>${x.section==="men"?"رجال":"نساء"}</td>
        <td>${text}</td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
