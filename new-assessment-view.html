<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض توزيع الكشف الجديد</title>
<link rel="icon" href="logo.png">

<style>
:root{--blue:#005b9f;--blue2:#0077c8;--text:#0f172a;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial;
  background:linear-gradient(180deg,#f8fbff,#eef4f9);
  color:var(--text);
}

.topbar{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  padding:20px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom-left-radius:28px;
}

.brand{display:flex;align-items:center;gap:14px}
.logo{width:60px;height:60px;background:white;border-radius:14px;padding:5px}
.brand h1{margin:0;font-size:22px;font-weight:900}

.btn{
  background:white;
  color:var(--blue);
  border:none;
  padding:8px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.main{
  width:94%;
  max-width:1200px;
  margin:25px auto;
}

.sections{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.panel{
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
}

.panel-head{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  padding:14px;
  display:flex;
  justify-content:space-between;
}

.panel-body{padding:14px}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:10px;
}

.stat{
  background:#f8fbff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  text-align:center;
  font-weight:bold;
}

.stat span{display:block;font-size:20px;margin-top:4px}

.table-wrap{
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th{
  background:#06345d;
  color:white;
  font-size:11px;
  padding:6px;
}

td{
  border:1px solid #e2e8f0;
  font-size:11px;
  padding:6px;
  text-align:center;
  word-break:break-word;
}

.badge{
  padding:3px 6px;
  border-radius:999px;
  font-size:10px;
  font-weight:bold;
}

.green{background:#dcfce7;color:#166534}
.yellow{background:#fef3c7;color:#92400e}
.red{background:#fee2e2;color:#b91c1c}
.gray{background:#e5e7eb;color:#374151}

.history{
  margin-top:18px;
  background:white;
  border-radius:22px;
  padding:14px;
  border:1px solid var(--line);
}

.reset{
  background:#dcfce7;
  font-weight:bold;
}

.suspend{
  background:#fef3c7;
  font-weight:bold;
}

@media(max-width:900px){
  .sections{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">
    <img src="logo.png" class="logo">
    <h1>عرض توزيع الكشف</h1>
  </div>
  <button class="btn" onclick="location.href='index.html'">الرئيسية</button>
</div>

<div class="main">

<div class="sections">

<!-- رجال -->
<div class="panel">
  <div class="panel-head">
    <span>قسم الرجال</span>
    <span id="menNext">—</span>
  </div>
  <div class="panel-body">

    <div class="stats">
      <div class="stat">الإجمالي <span id="menTotal">0</span></div>
      <div class="stat">بالدور <span id="menQueue">0</span></div>
      <div class="stat">بالاسم <span id="menName">0</span></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الأخصائي</th>
            <th>الإجمالي</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="menTable"></tbody>
      </table>
    </div>

  </div>
</div>

<!-- نساء -->
<div class="panel">
  <div class="panel-head">
    <span>قسم النساء</span>
    <span id="womenNext">—</span>
  </div>
  <div class="panel-body">

    <div class="stats">
      <div class="stat">الإجمالي <span id="womenTotal">0</span></div>
      <div class="stat">بالدور <span id="womenQueue">0</span></div>
      <div class="stat">بالاسم <span id="womenName">0</span></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الأخصائي</th>
            <th>الإجمالي</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="womenTable"></tbody>
      </table>
    </div>

  </div>
</div>

</div>

<div class="history">
  <h3>السجل</h3>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>القسم</th>
          <th>التفاصيل</th>
        </tr>
      </thead>
      <tbody id="log"></tbody>
    </table>
  </div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSy...",
authDomain:"akazcenter-89c17.firebaseapp.com",
projectId:"akazcenter-89c17"
});

const db=getFirestore(app);
const ref=collection(db,"newAssessments");

let data=[];

onSnapshot(ref,snap=>{
  data=[];
  snap.forEach(d=>data.push(d.data()));
  render();
});

function render(){

  const men=data.filter(x=>x.section==="men" && x.recordType==="assessment");
  const women=data.filter(x=>x.section==="women" && x.recordType==="assessment");

  document.getElementById("menTotal").innerText=men.length;
  document.getElementById("womenTotal").innerText=women.length;

  document.getElementById("menQueue").innerText=men.filter(x=>x.method==="queue").length;
  document.getElementById("womenQueue").innerText=women.filter(x=>x.method==="queue").length;

  document.getElementById("menName").innerText=men.filter(x=>x.method==="name").length;
  document.getElementById("womenName").innerText=women.filter(x=>x.method==="name").length;

  renderLog();
}

function renderLog(){
  const log=document.getElementById("log");
  log.innerHTML="";

  data.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  data.forEach(x=>{
    let text="";

    if(x.recordType==="assessment"){
      text=`${x.patient} - ${x.therapist}`;
    }
    if(x.recordType==="skip"){
      text=`تجاوز ${x.therapist}`;
    }
    if(x.recordType==="suspension"){
      text=`إيقاف ${x.therapist} حتى ${x.untilDate}`;
    }
    if(x.recordType==="balanceReset"){
      log.innerHTML+=`<tr class="reset"><td colspan="3">تم تحقيق التوازن وإعادة التوزيع</td></tr>`;
      return;
    }

    log.innerHTML+=`
      <tr>
        <td>${x.date || ""}</td>
        <td>${x.section==="men"?"رجال":"نساء"}</td>
        <td>${text}</td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
