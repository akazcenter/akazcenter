<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض توزيع الكشف الجديد</title>
<link rel="icon" href="logo.png">
<style>
:root{--blue:#005b9f;--blue2:#0077c8;--text:#0f172a;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(180deg,#f8fbff,#eef4f9);color:var(--text)}
.topbar{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;padding:20px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom-left-radius:28px}
.brand{display:flex;align-items:center;gap:14px}.logo{width:60px;height:60px;background:white;border-radius:14px;padding:5px}.brand h1{margin:0;font-size:22px;font-weight:900}
.btn{background:white;color:var(--blue);border:none;padding:8px 14px;border-radius:10px;font-weight:bold;cursor:pointer}.main{width:94%;max-width:1200px;margin:25px auto}.sections{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden}.panel-head{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;padding:14px;display:flex;justify-content:space-between}.panel-body{padding:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{background:#f8fbff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:bold}.stat span{display:block;font-size:20px;margin-top:4px}
.table-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed}th{background:#06345d;color:white;font-size:10.5px;padding:6px}td{border:1px solid #e2e8f0;font-size:10.5px;padding:6px;text-align:center;word-break:break-word}
.badge{display:inline-block;padding:3px 6px;border-radius:999px;font-size:10px;font-weight:bold;line-height:1.35}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#b91c1c}.gray{background:#e5e7eb;color:#374151}.orange{background:#ffedd5;color:#9a3412}.blue{background:#dbeafe;color:#1d4ed8}
.history{margin-top:18px;background:white;border-radius:22px;padding:14px;border:1px solid var(--line)}.reset{background:#dcfce7;font-weight:bold}.suspend{background:#fef3c7;font-weight:bold}.skip-row{background:#fff7ed}
@media(max-width:900px){.sections{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><div class="brand"><img src="logo.png" class="logo"><h1>عرض توزيع الكشف</h1></div><button class="btn" onclick="location.href='index.html'">الرئيسية</button></div>
<div class="main">
<div class="sections">
<div class="panel"><div class="panel-head"><span>قسم الرجال</span><span id="menNext">—</span></div><div class="panel-body"><div class="stats"><div class="stat">الإجمالي <span id="menTotal">0</span></div><div class="stat">بالدور <span id="menQueue">0</span></div><div class="stat">بالاسم <span id="menName">0</span></div></div><div class="table-wrap"><table><thead><tr><th>الأخصائي</th><th>تجاوز</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody id="menTable"></tbody></table></div></div></div>
<div class="panel"><div class="panel-head"><span>قسم النساء</span><span id="womenNext">—</span></div><div class="panel-body"><div class="stats"><div class="stat">الإجمالي <span id="womenTotal">0</span></div><div class="stat">بالدور <span id="womenQueue">0</span></div><div class="stat">بالاسم <span id="womenName">0</span></div></div><div class="table-wrap"><table><thead><tr><th>الأخصائي</th><th>تجاوز</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody id="womenTable"></tbody></table></div></div></div>
</div>
<div class="history"><h3>السجل</h3><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>القسم</th><th>التفاصيل</th></tr></thead><tbody id="log"></tbody></table></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyArYShiKgAnblA4aDEIr7zAM2q7oHbATJQ",authDomain:"akazcenter-89c17.firebaseapp.com",projectId:"akazcenter-89c17",storageBucket:"akazcenter-89c17.firebasestorage.app",messagingSenderId:"576111794528",appId:"1:576111794528:web:b7ee436f5bd0b60c4a6605"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const ref=collection(db,"newAssessments");

const menList=["د: حاتم الاحمدي","د: عبدالرحمن السويداء","د: عبدالرحمن السليمي","د: عبدالعزيز الحمدان"];
const womenList=["د: ريناد حميد","د: ابتسام سويلم","د: سلمى فرحان","د: أسماء فهيد","د: هند فهيد","د: مها فريح"];
const aliases={"د: حاتم الاحمدي":["حاتم","حاتم الاحمدي","حاتم الأحمدي"],"د: عبدالرحمن السويداء":["السويداء","عبدالرحمن السويداء"],"د: عبدالرحمن السليمي":["السليمي","عبدالرحمن السليمي"],"د: عبدالعزيز الحمدان":["الحمدان","عبدالعزيز الحمدان"],"د: ريناد حميد":["ريناد","ريناد حميد"],"د: ابتسام سويلم":["ابتسام","ابتسام سويلم","التسام"],"د: سلمى فرحان":["سلمى","سلمى فرحان"],"د: أسماء فهيد":["أسماء","اسماء","أسماء فهيد","اسماء فهيد"],"د: هند فهيد":["هند","هند فهيد"],"د: مها فريح":["مها","مها فريح"]};

let data=[];
onSnapshot(ref,snap=>{data=[];snap.forEach(d=>data.push(d.data()));render()});

function norm(v){return(v||"").toString().trim().replaceAll("أ","ا").replaceAll("إ","ا").replaceAll("آ","ا").replaceAll("ة","ه").replace(/\s+/g,"")}
function same(a,b){if(norm(a)===norm(b))return true;return(aliases[b]||[]).some(x=>norm(x)===norm(a))}
function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function itemDate(x){if(x.createdAt?.seconds)return new Date(x.createdAt.seconds*1000);if(x.date)return new Date(x.date);return new Date(0)}
function activeSusp(name,section){return data.find(x=>x.section===section&&x.recordType==="suspension"&&same(x.therapist,name)&&x.untilDate>=todayISO())}
function render(){
 const men=data.filter(x=>x.section==="men"&&x.recordType==="assessment");
 const women=data.filter(x=>x.section==="women"&&x.recordType==="assessment");
 menTotal.innerText=men.length;womenTotal.innerText=women.length;
 menQueue.innerText=men.filter(x=>x.method==="queue").length;womenQueue.innerText=women.filter(x=>x.method==="queue").length;
 menName.innerText=men.filter(x=>x.method==="name").length;womenName.innerText=women.filter(x=>x.method==="name").length;
 fill("men",menList,men,menTable);fill("women",womenList,women,womenTable);renderLog();
}
function skipCount(name,section){return data.filter(x=>x.section===section&&x.recordType==="skip"&&same(x.therapist,name)).length}
function fill(section,list,items,box){
 box.innerHTML="";
 const totals=list.map(n=>items.filter(x=>same(x.therapist,n)).length);const min=Math.min(...totals);
 list.forEach(name=>{
   const total=items.filter(x=>same(x.therapist,name)).length;
   const skip=skipCount(name,section);
   const susp=activeSusp(name,section);
   let status="";
   if(susp)status=`<span class="badge gray">متوقف عن استقبال الكشف<br>${susp.reason}<br>حتى ${susp.untilDate}</span>`;
   else if(skip>0)status=`<span class="badge orange">تم التجاوز بناءً على طلبه<br>عدد التجاوز: ${skip}</span>`;
   else if(total===min)status=`<span class="badge green">أولوية</span>`;
   else if(total-min<=1)status=`<span class="badge blue">قريب</span>`;
   else status=`<span class="badge red">أعلى +${total-min}</span>`;
   box.innerHTML+=`<tr><td>${name}</td><td>${skip}</td><td>${total}</td><td>${status}</td></tr>`;
 });
}
function renderLog(){
 log.innerHTML="";
 data.sort((a,b)=>itemDate(b)-itemDate(a));
 data.forEach(x=>{
  if(x.recordType==="balanceReset"){log.innerHTML+=`<tr class="reset"><td colspan="3">تم تحقيق التوازن وإعادة التوزيع</td></tr>`;return}
  let text="";
  if(x.recordType==="assessment")text=`تم تسجيل كشف: ${x.patient} - ${x.therapist}`;
  if(x.recordType==="skip")text=`تم تجاوز ${x.therapist} بناءً على طلبه`;
  if(x.recordType==="suspension")text=`تم إيقاف ${x.therapist} عن استقبال الكشف حتى ${x.untilDate} (${x.reason})`;
  log.innerHTML+=`<tr><td>${x.date||""}</td><td>${x.section==="men"?"رجال":"نساء"}</td><td>${text}</td></tr>`;
 });
}
</script>
<script type="module" src="tracker.js"></script>
</body>
</html>
