<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاقتراحات</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  direction:rtl;
  background:#f4f8fc;
}

/* TOP */
.topbar{
  background:#005b9f;
  color:white;
  padding:20px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

/* MAIN */
.main{
  width:90%;
  max-width:900px;
  margin:30px auto;
}

/* FORM */
.box{
  background:white;
  padding:25px;
  border-radius:16px;
  margin-bottom:20px;
}

label{
  font-weight:bold;
  display:block;
  margin:10px 0;
}

select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

textarea{
  height:120px;
}

button{
  margin-top:15px;
  padding:12px;
  width:100%;
  border:none;
  background:#005b9f;
  color:white;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* ADMIN */
.card{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-bottom:15px;
  cursor:pointer;
  border:1px solid #ddd;
}

.card:hover{
  background:#eef6ff;
}

.meta{
  color:#005b9f;
  font-weight:bold;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  width:90%;
  max-width:700px;
  border-radius:20px;
  padding:25px;
}

/* PRINT STYLE */
.print-area{
  padding:20px;
}

.print-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  width:80px;
}

.print-title{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  margin:15px 0;
}

.print-box{
  border:1px solid #ddd;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.print-btn{
  background:#16a34a;
}

/* PRINT */
@media print{
  body *{
    visibility:hidden;
  }

  #printSection, #printSection *{
    visibility:visible;
  }

  #printSection{
    position:absolute;
    top:0;
    right:0;
    width:100%;
  }

  .no-print{
    display:none;
  }
}
</style>
</head>

<body>

<div class="topbar">الاقتراحات</div>

<div class="main">

  <!-- EMPLOYEE -->
  <div class="box">
    <h3>إرسال اقتراح</h3>

    <label>الاسم</label>
    <select id="name">
      <option>اختر</option>
      <option>د. حاتم</option>
      <option>د. عبدالرحمن السويداء</option>
      <option>د. عبدالرحمن السليمي</option>
      <option>د. عبدالعزيز</option>
      <option>د. ريناد</option>
      <option>د. ابتسام</option>
      <option>د. سلمى</option>
      <option>أ. مرام</option>
      <option>أ. أشواق</option>
      <option>أ. شهد</option>
    </select>

    <label>الاقتراح</label>
    <textarea id="text"></textarea>

    <button onclick="send()">إرسال</button>
  </div>

  <!-- ADMIN -->
  <div class="box">
    <h3>الإدارة</h3>
    <input type="password" id="code" placeholder="الرمز السري">
    <button onclick="login()">دخول</button>
  </div>

  <div id="admin"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">

    <div id="printSection" class="print-area">

      <div class="print-header">
        <img src="logo.png" class="logo">
        <img src="logo.png" class="logo">
      </div>

      <div class="print-title">نموذج اقتراح</div>

      <div class="print-box">
        <div id="printName"></div>
        <div id="printDate"></div>
      </div>

      <div class="print-box" id="printText"></div>

    </div>

    <button class="print-btn no-print" onclick="window.print()">🖨️ طباعة</button>
    <button class="no-print" onclick="closeModal()">إغلاق</button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIza...",
  authDomain: "akazcenter-89c17.firebaseapp.com",
  projectId: "akazcenter-89c17"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const col = collection(db,"suggestions");

window.send = async ()=>{
  const name = document.getElementById("name").value;
  const text = document.getElementById("text").value;

  if(name === "اختر" || !text){
    alert("اكمل البيانات");
    return;
  }

  await addDoc(col,{
    name,
    text,
    createdAt:new Date()
  });

  alert("تم الإرسال");
};

window.login = ()=>{
  if(document.getElementById("code").value !== "1234"){
    alert("خطأ");
    return;
  }

  loadAdmin();
};

function loadAdmin(){
  const q = query(col, orderBy("createdAt","desc"));

  onSnapshot(q,(snap)=>{
    let html="";
    snap.forEach(doc=>{
      const d = doc.data();

      html+=`
      <div class="card" onclick='openItem("${d.name}","${d.text}","${new Date(d.createdAt.seconds*1000).toLocaleString("ar-SA")}")'>
        <div class="meta">${d.name}</div>
        <div>${d.text.substring(0,40)}...</div>
      </div>`;
    });

    document.getElementById("admin").innerHTML=html;
  });
}

window.openItem = (name,text,date)=>{
  document.getElementById("modal").style.display="flex";

  document.getElementById("printName").innerText="الاسم: "+name;
  document.getElementById("printDate").innerText="التاريخ: "+date;
  document.getElementById("printText").innerText=text;
};

window.closeModal = ()=>{
  document.getElementById("modal").style.display="none";
};
</script>

</body>
</html>
