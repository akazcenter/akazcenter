<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة</title>

<style>
body{
  margin:0;
  font-family:Tahoma,Arial;
  direction:rtl;
  background:linear-gradient(180deg,#f8fbff,#eef4f9);
  color:#0f172a;
}
.topbar{
  background:linear-gradient(135deg,#005b9f,#0077c8);
  color:white;
  padding:20px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom-left-radius:28px;
  border-bottom-right-radius:28px;
}
.home-btn{
  background:white;
  color:#005b9f;
  border:none;
  padding:10px 16px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}
.main{
  width:92%;
  max-width:1200px;
  margin:35px auto;
}
.login-box,.panel{
  background:white;
  border-radius:24px;
  padding:25px;
  box-shadow:0 16px 40px rgba(15,23,42,.10);
  border:1px solid #e2e8f0;
}
.login-box{
  max-width:450px;
  margin:60px auto;
}
input{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid #cbd5e1;
  font-size:16px;
  margin-top:10px;
}
button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:none;
  border-radius:12px;
  background:#005b9f;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.panel{display:none}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-bottom:25px;
}
.card{
  background:#f8fbff;
  border:1px solid #e2e8f0;
  border-radius:20px;
  padding:20px;
}
.card h3{
  margin:0 0 10px;
  color:#005b9f;
}
.number{
  font-size:34px;
  font-weight:900;
  color:#f59e0b;
}
.section-title{
  color:#005b9f;
  margin:28px 0 14px;
}
.item{
  background:#f8fbff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
}
.small{
  color:#64748b;
  font-size:12px;
}
.bad{color:#b91c1c;font-weight:bold;}
.good{color:#166534;font-weight:bold;}
</style>
</head>

<body>

<div class="topbar">
  <h2>لوحة الإدارة</h2>
  <button class="home-btn" onclick="location.href='index.html'">🏠 الرئيسية</button>
</div>

<div class="main">

  <div id="loginBox" class="login-box">
    <h2>دخول الإدارة</h2>
    <input type="password" id="adminCode" placeholder="ادخل الرمز السري">
    <button onclick="login()">دخول</button>
  </div>

  <div id="panel" class="panel">

    <!-- الكروت -->
    <div class="cards">
      <div class="card">
        <h3>الأجهزة النشطة الآن</h3>
        <div class="number" id="activeDevicesCount">0</div>
        <div class="small">آخر 60 ثانية</div>
      </div>

      <div class="card">
        <h3>طلبات الشفت</h3>
        <div class="number" id="newShiftCount">0</div>
      </div>

      <div class="card">
        <h3>اقتراحات</h3>
        <div class="number" id="suggestionsCount">0</div>
      </div>

      <div class="card">
        <h3>زيارات منزلية</h3>
        <div class="number" id="homeVisitsCount">0</div>
      </div>
    </div>

    <!-- الأجهزة -->
    <h2 class="section-title">الأجهزة المتصلة</h2>
    <div id="devicesList"></div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyArYShiKgAnblA4aDEIr7zAM2q7oHbATJQ",
  authDomain: "akazcenter-89c17.firebaseapp.com",
  projectId: "akazcenter-89c17"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_CODE = "164321";

window.login = function(){
  const code = document.getElementById("adminCode").value;

  if(code !== ADMIN_CODE){
    alert("خطأ");
    return;
  }

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("panel").style.display = "block";

  load();
};

function toDate(v){
  if(!v) return new Date(0);
  if(v.seconds) return new Date(v.seconds*1000);
  return new Date(v);
}

function load(){

  // الأجهزة
  onSnapshot(collection(db,"activeDevices"), snap=>{
    const now = new Date();
    let active = [];

    snap.forEach(d=>{
      const x = d.data();
      const last = toDate(x.lastSeen);
      const diff = Math.floor((now - last)/1000);

      if(diff <= 60){
        active.push({...x,diff});
      }
    });

    document.getElementById("activeDevicesCount").innerText = active.length;

    const box = document.getElementById("devicesList");
    box.innerHTML = "";

    if(active.length === 0){
      box.innerHTML = `<div class="item">لا يوجد أحد داخل الآن</div>`;
      return;
    }

    active.forEach((x,i)=>{
      box.innerHTML += `
        <div class="item">
          <b>جهاز ${i+1}</b><br>
          الصفحة: ${x.page}<br>
          <span class="small">قبل ${x.diff} ثانية</span>
        </div>
      `;
    });
  });

  // اقتراحات
  onSnapshot(collection(db,"suggestions"), snap=>{
    document.getElementById("suggestionsCount").innerText = snap.size;
  });

  // زيارات
  onSnapshot(collection(db,"homeVisits"), snap=>{
    document.getElementById("homeVisitsCount").innerText = snap.size;
  });

  // شفت
  onSnapshot(collection(db,"shiftRequests"), snap=>{
    let count = 0;
    snap.forEach(d=>{
      if(d.data().status === "new") count++;
    });
    document.getElementById("newShiftCount").innerText = count;
  });

}
</script>

<!-- مهم جداً -->
<script type="module" src="tracker.js"></script>

</body>
</html>
