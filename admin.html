<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  direction:rtl;
  background:#f4f8fc;
}
.topbar{
  background:#005b9f;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
}
.main{width:92%;margin:30px auto;}
.box{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}
.card{
  background:#eef6ff;
  padding:15px;
  border-radius:12px;
}
.number{
  font-size:28px;
  font-weight:bold;
  color:#f59e0b;
}
.btn{
  background:#005b9f;
  color:white;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-top:10px;
}
.link{
  display:block;
  background:#eef6ff;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  cursor:pointer;
}
.item{
  background:#f8fbff;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
}
</style>
</head>

<body>

<div class="topbar">
  <h3>لوحة التحكم</h3>
  <button onclick="location.href='index.html'">الرئيسية</button>
</div>

<div class="main">

<div id="loginBox" class="box">
  <h3>دخول الإدارة</h3>
  <input id="code" placeholder="الرمز">
  <button class="btn" onclick="login()">دخول</button>
</div>

<div id="panel" style="display:none">

<!-- الإحصائيات -->
<div class="box grid">
  <div class="card">
    الأجهزة الآن
    <div class="number" id="devicesCount">0</div>
  </div>

  <div class="card">
    اقتراحات
    <div class="number" id="suggestionsCount">0</div>
  </div>

  <div class="card">
    زيارات منزلية
    <div class="number" id="homeCount">0</div>
  </div>

  <div class="card">
    أكثر ضغط
    <div class="number" id="topTherapist">—</div>
  </div>
</div>

<!-- روابط -->
<div class="box">
  <h3>تشغيل سريع</h3>

  <div class="link" onclick="go('work-schedule.html')">📋 جدول الدوام</div>
  <div class="link" onclick="go('therapist-planners.html')">📅 جدول الأخصائيين</div>
  <div class="link" onclick="go('new-assessment-entry.html')">🩺 توزيع الكشف</div>
  <div class="link" onclick="go('home-visits.html')">🏠 الزيارات المنزلية</div>
  <div class="link" onclick="go('functional-assessments.html')">📊 التقييمات</div>

</div>

<!-- التحكم -->
<div class="box">
  <h3>تحكم مباشر</h3>

  <button class="btn" onclick="resetQueue('men')">تصفير دور الرجال</button>
  <button class="btn" onclick="resetQueue('women')">تصفير دور النساء</button>

  <button class="btn" onclick="clearToday()">حذف كشف اليوم</button>

  <button class="btn" onclick="cleanDevices()">تنظيف الأجهزة القديمة</button>
</div>

<!-- الأجهزة -->
<div class="box">
  <h3>الأجهزة المتصلة</h3>
  <div id="devicesList"></div>
</div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyArYShiKgAnblA4aDEIr7zAM2q7oHbATJQ",
  authDomain: "akazcenter-89c17.firebaseapp.com",
  projectId: "akazcenter-89c17"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CODE = "164321";

window.login = function(){
  if(document.getElementById("code").value !== CODE){
    alert("خطأ");
    return;
  }

  document.getElementById("loginBox").style.display="none";
  document.getElementById("panel").style.display="block";
  load();
};

window.go = function(p){
  location.href=p;
};

function toDate(v){
  if(!v) return new Date(0);
  if(v.seconds) return new Date(v.seconds*1000);
  return new Date(v);
}

function load(){

  // الأجهزة
  onSnapshot(collection(db,"activeDevices"), snap=>{
    let now = new Date();
    let active=[];

    snap.forEach(d=>{
      let x=d.data();
      let last=toDate(x.lastSeen);
      let diff=(now-last)/1000;

      if(diff<60){
        active.push({...x,diff});
      }
    });

    document.getElementById("devicesCount").innerText=active.length;

    let box=document.getElementById("devicesList");
    box.innerHTML="";

    active.forEach((x,i)=>{
      box.innerHTML+=`
      <div class="item">
      جهاز ${i+1} - ${x.page}<br>
      ${Math.floor(x.diff)} ثانية
      </div>`;
    });
  });

  // اقتراحات
  onSnapshot(collection(db,"suggestions"), snap=>{
    document.getElementById("suggestionsCount").innerText=snap.size;
  });

  // زيارات
  onSnapshot(collection(db,"homeVisits"), snap=>{
    document.getElementById("homeCount").innerText=snap.size;
  });

  // ضغط
  onSnapshot(collection(db,"therapistSchedules"), snap=>{
    let count={};

    snap.forEach(d=>{
      let t=d.data().therapist;
      if(!t) return;
      count[t]=(count[t]||0)+1;
    });

    let max=0,name="—";
    for(let k in count){
      if(count[k]>max){
        max=count[k];
        name=k;
      }
    }

    document.getElementById("topTherapist").innerText=name;
  });

}

// 🔴 التحكم

window.resetQueue = async function(section){
  if(!confirm("تأكيد تصفير الدور؟")) return;

  await setDoc(doc(db,"newAssessmentQueueState",section),{
    section,
    index:0,
    updatedAt:new Date()
  });

  alert("تم التصفير");
};

window.clearToday = async function(){
  if(!confirm("حذف كل كشف اليوم؟")) return;

  let snap = await getDocs(collection(db,"newAssessments"));

  snap.forEach(async d=>{
    await deleteDoc(d.ref);
  });

  alert("تم الحذف");
};

window.cleanDevices = async function(){
  let snap = await getDocs(collection(db,"activeDevices"));
  let now=new Date();

  snap.forEach(async d=>{
    let x=d.data();
    let last=toDate(x.lastSeen);

    if((now-last)/1000 > 120){
      await deleteDoc(d.ref);
    }
  });

  alert("تم تنظيف الأجهزة");
};

</script>

<script type="module" src="tracker.js"></script>

</body>
</html>
