<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة</title>

<style>
body{
  margin:0;
  font-family:Tahoma,Arial;
  direction:rtl;
  background:linear-gradient(180deg,#f8fbff,#eef4f9);
}

.topbar{
  background:linear-gradient(135deg,#005b9f,#0077c8);
  color:white;
  padding:20px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom-left-radius:28px;
  border-bottom-right-radius:28px;
}

.home-btn{
  background:white;
  color:#005b9f;
  border:none;
  padding:10px 16px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.main{
  width:92%;
  max-width:1200px;
  margin:35px auto;
}

.login-box,.panel{
  background:white;
  border-radius:24px;
  padding:25px;
  box-shadow:0 16px 40px rgba(15,23,42,.10);
}

.login-box{
  max-width:400px;
  margin:80px auto;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:10px;
}

button{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#005b9f;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.panel{display:none}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.card{
  background:#f1f5f9;
  border-radius:16px;
  padding:18px;
}

.card h3{
  margin:0;
  color:#005b9f;
}

.number{
  font-size:30px;
  font-weight:bold;
  color:#f59e0b;
}

.section{
  margin-top:30px;
}

.item{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  padding:12px;
  border-radius:10px;
  margin-bottom:8px;
}

.small{
  font-size:12px;
  color:#666;
}

.alert{
  background:#fee2e2;
  padding:12px;
  border-radius:10px;
  color:#b91c1c;
  margin-bottom:15px;
}
</style>
</head>

<body>

<div class="topbar">
  <h2>لوحة الإدارة</h2>
  <button class="home-btn" onclick="location.href='index.html'">🏠 الرئيسية</button>
</div>

<div class="main">

  <div id="loginBox" class="login-box">
    <h2>دخول الإدارة</h2>
    <input type="password" id="code" placeholder="الرمز">
    <button onclick="login()">دخول</button>
  </div>

  <div id="panel" class="panel">

    <div id="alertBox"></div>

    <div class="cards">
      <div class="card">
        <h3>الأجهزة الآن</h3>
        <div class="number" id="devicesCount">0</div>
      </div>

      <div class="card">
        <h3>اقتراحات</h3>
        <div class="number" id="suggestionsCount">0</div>
      </div>

      <div class="card">
        <h3>زيارات منزلية</h3>
        <div class="number" id="homeCount">0</div>
      </div>

      <div class="card">
        <h3>أكثر ضغط</h3>
        <div class="number" id="topTherapist">—</div>
      </div>
    </div>

    <div class="section">
      <h3>الأجهزة المتصلة</h3>
      <div id="devicesList"></div>
    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyArYShiKgAnblA4aDEIr7zAM2q7oHbATJQ",
  authDomain: "akazcenter-89c17.firebaseapp.com",
  projectId: "akazcenter-89c17"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CODE = "164321";

window.login = function(){
  if(document.getElementById("code").value !== CODE){
    alert("خطأ");
    return;
  }

  document.getElementById("loginBox").style.display="none";
  document.getElementById("panel").style.display="block";
  load();
};

function toDate(v){
  if(!v) return new Date(0);
  if(v.seconds) return new Date(v.seconds*1000);
  return new Date(v);
}

function load(){

  // الأجهزة
  onSnapshot(collection(db,"activeDevices"), snap=>{
    const now = new Date();
    let active=[];

    snap.forEach(d=>{
      const x = d.data();
      const last = toDate(x.lastSeen);
      const diff = (now-last)/1000;

      if(diff < 60){
        active.push({...x,diff});
      }
    });

    document.getElementById("devicesCount").innerText = active.length;

    const box = document.getElementById("devicesList");
    box.innerHTML="";

    active.forEach((x,i)=>{
      box.innerHTML += `
        <div class="item">
          جهاز ${i+1}<br>
          الصفحة: ${x.page}<br>
          <span class="small">${Math.floor(x.diff)} ثانية</span>
        </div>
      `;
    });
  });

  // اقتراحات
  onSnapshot(collection(db,"suggestions"), snap=>{
    document.getElementById("suggestionsCount").innerText = snap.size;
  });

  // زيارات
  onSnapshot(collection(db,"homeVisits"), snap=>{
    document.getElementById("homeCount").innerText = snap.size;
  });

  // أكثر ضغط
  onSnapshot(collection(db,"therapistSchedules"), snap=>{
    let count={};

    snap.forEach(d=>{
      const t = d.data().therapist;
      if(!t) return;
      count[t]=(count[t]||0)+1;
    });

    let max=0,name="—";
    for(let k in count){
      if(count[k]>max){
        max=count[k];
        name=k;
      }
    }

    document.getElementById("topTherapist").innerText=name;
  });

  // تنبيه بسيط
  const today = new Date().getDate();
  if(today===20){
    document.getElementById("alertBox").innerHTML =
      `<div class="alert">اليوم موعد رفع الزيارات المنزلية</div>`;
  }

}
</script>

<script type="module" src="tracker.js"></script>

</body>
</html>
