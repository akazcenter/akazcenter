<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - مركز عكاز</title>

<style>
:root{
  --blue:#005b9f;
  --blue2:#0077c8;
  --orange:#f59e0b;
  --bg:#f8fbff;
  --card:#ffffff;
  --line:#e2e8f0;
  --muted:#64748b;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial;
  direction:rtl;
  background:linear-gradient(180deg,#f9fcff,#eef4f9);
}

/* HEADER */
.topbar{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  padding:26px;
  text-align:center;
  font-weight:900;
  font-size:24px;
  border-bottom-left-radius:32px;
  border-bottom-right-radius:32px;
  box-shadow:0 20px 45px rgba(0,0,0,.15);
}

/* MAIN */
.main{
  width:92%;
  max-width:1300px;
  margin:30px auto;
}

/* LOGIN */
.login{
  background:var(--card);
  padding:28px;
  border-radius:20px;
  max-width:420px;
  margin:90px auto;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.12);
}

input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  background:var(--blue);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* ALERT */
.alert{
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#92400e;
  padding:14px;
  border-radius:14px;
  margin-bottom:20px;
  font-weight:bold;
  text-align:center;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:20px;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
  text-align:center;
}

.card h3{
  margin:0;
  color:var(--blue);
}

.number{
  font-size:36px;
  font-weight:900;
  color:var(--orange);
  margin-top:10px;
}

/* TABS */
.tabs{
  display:flex;
  gap:10px;
  margin-top:25px;
  flex-wrap:wrap;
}

.tab{
  padding:10px 16px;
  border-radius:10px;
  background:#eef6ff;
  cursor:pointer;
  font-weight:bold;
}

.tab.active{
  background:var(--blue);
  color:white;
}

/* SECTION */
.section{
  margin-top:15px;
  background:var(--card);
  border-radius:18px;
  padding:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.06);
}

/* ITEMS */
.item{
  background:#f8fbff;
  padding:12px;
  border-radius:12px;
  margin-bottom:8px;
  border:1px solid var(--line);
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid var(--line);
  padding:10px;
  text-align:center;
}

th{
  background:var(--blue);
  color:white;
}

.small{
  color:var(--muted);
  font-size:12px;
}
</style>
</head>

<body>

<div class="topbar">لوحة التحكم - مركز عكاز</div>

<div class="main">

<div id="login" class="login">
  <h3>دخول الإدارة</h3>
  <input id="code" placeholder="الرمز">
  <button onclick="login()">دخول</button>
</div>

<div id="panel" style="display:none">

<div id="alertBox" class="alert">جاري التحميل...</div>

<!-- STATS -->
<div class="grid">
  <div class="card">
    <h3>الجلسات اليوم</h3>
    <div class="number" id="sessions">0</div>
  </div>

  <div class="card">
    <h3>كشف جديد</h3>
    <div class="number" id="newCases">0</div>
  </div>

  <div class="card">
    <h3>بالاسم</h3>
    <div class="number" id="byName">0</div>
  </div>

  <div class="card">
    <h3>أعلى ضغط</h3>
    <div class="number" id="topTherapist">—</div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="openTab('overview',this)">نظرة عامة</div>
  <div class="tab" onclick="openTab('online',this)">المتصلين</div>
  <div class="tab" onclick="openTab('logs',this)">السجل</div>
  <div class="tab" onclick="openTab('analytics',this)">الإحصائيات</div>
  <div class="tab" onclick="openTab('approvals',this)">الاعتمادات</div>
</div>

<div id="tabContent" class="section"></div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyArYShiKgAnblA4aDEIr7zAM2q7oHbATJQ",
  projectId:"akazcenter-89c17"
});

const db = getFirestore(app);
const CODE="164321";

window.login=()=>{
  if(document.getElementById("code").value!==CODE){
    alert("خطأ");
    return;
  }
  document.getElementById("login").style.display="none";
  document.getElementById("panel").style.display="block";
  load();
};

function load(){

// الجلسات
onSnapshot(collection(db,"therapistSchedules"), snap=>{
  document.getElementById("sessions").innerText=snap.size;

  let count={};
  snap.forEach(d=>{
    let t=d.data().therapist;
    if(t) count[t]=(count[t]||0)+1;
  });

  let max=0,name="—";
  for(let k in count){
    if(count[k]>max){max=count[k];name=k;}
  }
  document.getElementById("topTherapist").innerText=name;
});

// كشف
onSnapshot(collection(db,"newAssessments"), snap=>{
  let total=0,byName=0;

  snap.forEach(d=>{
    total++;
    if(d.data().type==="name") byName++;
  });

  document.getElementById("newCases").innerText=total;
  document.getElementById("byName").innerText=byName;

  document.getElementById("alertBox").innerText =
    total>20 ? "🚨 ضغط عالي اليوم" : "الوضع مستقر";
});

openTab('overview',document.querySelector('.tab'));
}

// TABS
window.openTab=function(type,el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");

  let html="";

  if(type==="overview"){
    html="نظرة عامة على النظام";
  }

  if(type==="online"){
    html='<div id="online"></div>';
    onSnapshot(collection(db,"activeDevices"), snap=>{
      let out="";
      snap.forEach(d=>{
        let x=d.data();
        out+=`<div class="item">${x.page}</div>`;
      });
      document.getElementById("online").innerHTML=out || "لا يوجد";
    });
  }

  if(type==="logs"){
    html='<div id="logs"></div>';
    onSnapshot(collection(db,"activityLogs"), snap=>{
      let arr=[];
      snap.forEach(d=>arr.push(d.data()));
      arr.sort((a,b)=>b.time.seconds-a.time.seconds);

      let out="";
      arr.slice(0,15).forEach(x=>{
        out+=`<div class="item">${x.page} - ${x.action}</div>`;
      });

      document.getElementById("logs").innerHTML=out || "لا يوجد";
    });
  }

  if(type==="analytics"){
    html='<div class="item">إحصائيات قادمة</div>';
  }

  if(type==="approvals"){
    html='<div class="item">حالة اعتماد الجداول</div>';
  }

  document.getElementById("tabContent").innerHTML=html;
};
</script>

<script type="module" src="tracker.js"></script>

</body>
</html>
