<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  direction:rtl;
  background:linear-gradient(180deg,#f8fbff,#eef4f9);
}

/* الهيدر */
.topbar{
  background:linear-gradient(135deg,#005b9f,#0077c8);
  color:white;
  padding:22px;
  text-align:center;
  font-size:22px;
  font-weight:900;
  border-bottom-left-radius:30px;
  border-bottom-right-radius:30px;
}

/* المحتوى */
.main{
  width:92%;
  max-width:1200px;
  margin:30px auto;
}

/* تسجيل الدخول */
.login{
  background:white;
  padding:25px;
  border-radius:20px;
  max-width:400px;
  margin:80px auto;
  text-align:center;
  box-shadow:0 15px 35px rgba(0,0,0,.1);
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#005b9f;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* الكروت */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
  text-align:center;
}

.card h3{
  margin:0;
  color:#005b9f;
}

.number{
  font-size:36px;
  font-weight:900;
  color:#f59e0b;
  margin-top:10px;
}

/* التنبيه */
.alert{
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#92400e;
  padding:12px;
  border-radius:12px;
  margin-bottom:20px;
  text-align:center;
  font-weight:bold;
}

/* الروابط */
.links{
  margin-top:30px;
}

.link{
  background:white;
  padding:16px;
  border-radius:14px;
  margin-bottom:10px;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.05);
  transition:.2s;
}

.link:hover{
  transform:translateY(-3px);
}

.link b{
  color:#005b9f;
}

/* النشاط */
.activity{
  margin-top:30px;
}

.item{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:8px;
  box-shadow:0 5px 15px rgba(0,0,0,.05);
}
</style>
</head>

<body>

<div class="topbar">لوحة التحكم - مركز عكاز</div>

<div class="main">

<div id="login" class="login">
  <h3>دخول الإدارة</h3>
  <input id="code" placeholder="الرمز">
  <button onclick="login()">دخول</button>
</div>

<div id="panel" style="display:none">

<div class="alert">
الوضع مستقر — لا توجد مشاكل حالياً
</div>

<!-- الإحصائيات -->
<div class="grid">
  <div class="card">
    <h3>الجلسات اليوم</h3>
    <div class="number" id="sessions">0</div>
  </div>

  <div class="card">
    <h3>كشف جديد</h3>
    <div class="number" id="newCases">0</div>
  </div>

  <div class="card">
    <h3>بالاسم</h3>
    <div class="number" id="byName">0</div>
  </div>

  <div class="card">
    <h3>أعلى ضغط</h3>
    <div class="number" id="topTherapist">—</div>
  </div>
</div>

<!-- تشغيل سريع -->
<div class="links">
  <div class="link" onclick="go('work-schedule.html')"><b>📋 جدول الدوام</b></div>
  <div class="link" onclick="go('therapist-planners.html')"><b>📅 جدول الأخصائيين</b></div>
  <div class="link" onclick="go('new-assessment-entry.html')"><b>🩺 توزيع الكشف</b></div>
  <div class="link" onclick="go('home-visits.html')"><b>🏠 الزيارات المنزلية</b></div>
  <div class="link" onclick="go('functional-assessments.html')"><b>📊 التقييمات</b></div>
</div>

<!-- النشاط -->
<div class="activity">
  <h3 style="color:#005b9f">آخر النشاط</h3>
  <div id="activity"></div>
</div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSy...",
  projectId:"akazcenter-89c17"
});

const db = getFirestore(app);

const CODE="164321";

window.login=()=>{
  if(document.getElementById("code").value!==CODE){
    alert("خطأ");
    return;
  }
  document.getElementById("login").style.display="none";
  document.getElementById("panel").style.display="block";
  load();
};

window.go=p=>location.href=p;

function load(){

  // الجلسات
  onSnapshot(collection(db,"therapistSchedules"), snap=>{
    document.getElementById("sessions").innerText=snap.size;

    let count={};
    snap.forEach(d=>{
      let t=d.data().therapist;
      if(!t)return;
      count[t]=(count[t]||0)+1;
    });

    let max=0,name="—";
    for(let k in count){
      if(count[k]>max){max=count[k];name=k;}
    }

    document.getElementById("topTherapist").innerText=name;
  });

  // الكشف
  onSnapshot(collection(db,"newAssessments"), snap=>{
    let total=0,byName=0;

    snap.forEach(d=>{
      total++;
      if(d.data().type==="name") byName++;
    });

    document.getElementById("newCases").innerText=total;
    document.getElementById("byName").innerText=byName;
  });

  // النشاط
  onSnapshot(collection(db,"homeVisits"), snap=>{
    let html="";
    snap.forEach(d=>{
      let x=d.data();
      html+=`<div class="item">${x.therapist || "زيارة منزلية"}</div>`;
    });
    document.getElementById("activity").innerHTML=html || "لا يوجد نشاط";
  });

}
</script>

</body>
</html>
