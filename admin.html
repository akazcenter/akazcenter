<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>

<style>
body{font-family:Tahoma;margin:0;background:#f4f8fc;direction:rtl}
.top{background:#005b9f;color:white;padding:20px;text-align:center}
.main{width:90%;margin:30px auto}

.box{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

.item{
background:#eef6ff;
padding:10px;
border-radius:10px;
margin-bottom:8px;
}

input,button{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
}

button{
background:#005b9f;
color:white;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="top">لوحة التحكم</div>

<div class="main">

<div id="login">
<h3>دخول</h3>
<input id="code" placeholder="الرمز">
<button onclick="login()">دخول</button>
</div>

<div id="panel" style="display:none">

<div class="box">
<h3>المتصلين الآن</h3>
<div id="online"></div>
</div>

<div class="box">
<h3>آخر الإجراءات</h3>
<div id="logs"></div>
</div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyArYShiKgAnblA4aDEIr7zAM2q7oHbATJQ",
  projectId:"akazcenter-89c17"
});

const db = getFirestore(app);

const CODE="164321";

window.login=()=>{
  if(document.getElementById("code").value!==CODE){
    alert("خطأ");
    return;
  }

  document.getElementById("login").style.display="none";
  document.getElementById("panel").style.display="block";
  load();
};

function load(){

// المتصلين
onSnapshot(collection(db,"activeDevices"), snap=>{
  let html="";
  let now=new Date();

  snap.forEach(d=>{
    let x=d.data();
    let last=new Date(x.lastSeen.seconds*1000);
    let diff=(now-last)/1000;

    if(diff<60){
      html+=`
      <div class="item">
      ${x.page}<br>
      قبل ${Math.floor(diff)} ثانية
      </div>`;
    }
  });

  document.getElementById("online").innerHTML = html || "لا يوجد";
});


// النشاط
onSnapshot(collection(db,"activityLogs"), snap=>{
  let arr=[];

  snap.forEach(d=>{
    arr.push(d.data());
  });

  arr.sort((a,b)=>b.time.seconds - a.time.seconds);

  let html="";

  arr.slice(0,15).forEach(x=>{
    html+=`
    <div class="item">
    ${x.page} — ${x.action}<br>
    <small>${new Date(x.time.seconds*1000).toLocaleTimeString()}</small>
    </div>`;
  });

  document.getElementById("logs").innerHTML = html || "لا يوجد";
});

}
</script>

</body>
</html>
