<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة النقدية</title>
<link rel="icon" href="logo.png">

<style>
:root{
  --blue:#005b9f;
  --blue2:#0077c8;
  --orange:#f59e0b;
  --green:#16a34a;
  --red:#dc2626;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --bg:#f8fbff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(180deg,#f8fbff,#eef4f9);
  color:var(--text);
}

.hidden{display:none!important}

.topbar{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  padding:20px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom-left-radius:28px;
  box-shadow:0 16px 38px rgba(8,52,95,.22);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:64px;
  height:64px;
  background:white;
  border-radius:16px;
  padding:6px;
  object-fit:contain;
}

.brand h1{
  margin:0;
  font-size:27px;
  font-weight:900;
}

.brand p{
  margin:4px 0 0;
  color:#dbeafe;
  direction:ltr;
  font-size:12px;
}

.btn{
  border:none;
  border-radius:12px;
  padding:11px 16px;
  font-family:Tahoma,Arial;
  font-weight:900;
  cursor:pointer;
}

.btn-white{background:white;color:var(--blue)}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white}
.btn-green{background:#dcfce7;color:#166534;border:1px solid #86efac}
.btn-red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.btn-orange{background:#fff7ed;color:#92400e;border:1px solid #fed7aa}

.main{
  width:94%;
  max-width:1450px;
  margin:26px auto;
}

.intro{
  background:white;
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  text-align:center;
  box-shadow:0 12px 30px rgba(15,23,42,.07);
  margin-bottom:22px;
}

.intro h2{
  margin:0;
  color:var(--blue);
  font-size:30px;
  font-weight:900;
}

.intro p{
  margin:10px 0 0;
  color:var(--muted);
  line-height:1.8;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:28px;
  padding:28px 18px;
  text-align:center;
  box-shadow:0 16px 38px rgba(15,23,42,.09);
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:100%;
  height:7px;
  background:linear-gradient(90deg,var(--orange),#ffd28a);
}

.icon{
  width:78px;
  height:78px;
  margin:0 auto 16px;
  border-radius:26px;
  background:#eef6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:900;
  color:var(--blue);
}

.card h3{
  margin:0;
  color:var(--blue);
  font-size:25px;
  font-weight:900;
}

.card h4{
  margin:7px 0 8px;
  color:var(--orange);
  direction:ltr;
  font-size:12px;
}

.card p{
  margin:0;
  color:var(--muted);
  font-size:12.5px;
  line-height:1.8;
}

.pin-box{
  display:grid;
  grid-template-columns:1fr auto;
  gap:9px;
  margin-top:18px;
}

.pin-box input{
  border:1px solid #cbd5e1;
  border-radius:13px;
  padding:11px;
  text-align:center;
  font-family:Tahoma;
  font-weight:900;
  background:#f8fafc;
}

.pin-box button{
  border:none;
  border-radius:13px;
  padding:0 15px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-weight:900;
}

.status-box{
  border-radius:20px;
  padding:15px;
  text-align:center;
  font-weight:900;
  margin-bottom:18px;
  line-height:1.8;
}

.status-available{background:#dcfce7;border:1px solid #86efac;color:#166534}
.status-unavailable{background:#fee2e2;border:1px solid #fecaca;color:#991b1b}
.status-delay{background:#fff7ed;border:1px solid #fed7aa;color:#92400e}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:18px;
  justify-content:center;
}

.admin-summary{
  grid-template-columns:repeat(4,1fr);
}

.summary-card{
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  text-align:center;
  box-shadow:0 12px 28px rgba(15,23,42,.07);
}

.summary-card h3{
  margin:0 0 8px;
  color:var(--muted);
  font-size:13px;
  font-weight:900;
}

.summary-card span{
  display:block;
  font-size:27px;
  font-weight:900;
  color:var(--blue);
  direction:ltr;
}

.summary-card.green span{color:var(--green)}
.summary-card.orange span{color:var(--orange)}
.summary-card.red span{color:var(--red)}

.sections{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:18px;
}

.panel{
  background:white;
  border:1px solid var(--line);
  border-radius:24px;
  padding:18px;
  box-shadow:0 12px 30px rgba(15,23,42,.07);
}

.panel h2{
  margin:0 0 14px;
  color:var(--blue);
  font-size:24px;
  font-weight:900;
}

.help{
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
  margin-bottom:12px;
}

.cash-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  overflow:hidden;
  border-radius:16px;
}

.cash-table th{
  background:#06345d;
  color:white;
  padding:10px 6px;
  font-size:12px;
  border:1px solid #17456f;
  font-weight:900;
}

.cash-table td{
  border:1px solid #e2e8f0;
  padding:8px 6px;
  text-align:center;
  font-size:13px;
  font-weight:900;
}

.cash-table input,
.panel input,
.panel select{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:10px;
  text-align:center;
  font-family:Tahoma,Arial;
  font-size:14px;
  font-weight:900;
  background:#f8fafc;
}

.total-line{
  margin-top:14px;
  background:#eef6ff;
  border:1px solid #bfdbfe;
  border-radius:16px;
  padding:14px;
  text-align:center;
  font-weight:900;
  color:#1d4ed8;
}

.total-line span{
  display:block;
  margin-top:8px;
  font-size:30px;
  color:var(--blue);
  direction:ltr;
}

.revenue-input{
  width:100%;
  border:2px solid #bfdbfe!important;
  border-radius:18px!important;
  padding:18px!important;
  font-size:28px!important;
  color:var(--blue);
  background:#f8fbff!important;
}

.status-result{
  margin-top:16px;
  border-radius:18px;
  padding:18px;
  text-align:center;
  font-weight:900;
  font-size:18px;
}

.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
.bad{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.more{background:#fff7ed;color:#92400e;border:1px solid #fed7aa}

.box-preview{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:14px;
}

.preview-item{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:12px;
  text-align:center;
  font-weight:900;
  color:#334155;
}

.preview-item strong{
  display:block;
  color:var(--blue);
  font-size:20px;
  margin-top:6px;
  direction:ltr;
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:16px;
}

.actions button{
  padding:15px;
  border-radius:15px;
  font-size:14px;
}

.footer{
  width:90%;
  max-width:1200px;
  margin:45px auto 20px;
  padding-top:18px;
  border-top:1px solid #dbe4ee;
  text-align:center;
  color:#64748b;
  font-size:14px;
}

@media(max-width:1100px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .summary-grid,.admin-summary{grid-template-columns:repeat(2,1fr)}
  .sections{grid-template-columns:1fr}
  .box-preview{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:650px){
  .topbar{flex-direction:column;text-align:center;gap:12px}
  .brand{flex-direction:column}
  .cards,.summary-grid,.admin-summary,.box-preview,.actions{grid-template-columns:1fr}
}
</style>
</head>
