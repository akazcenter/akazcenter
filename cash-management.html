<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة النقدية</title>
<link rel="icon" href="logo.png">

<style>
:root{
  --b:#005b9f;
  --b2:#0077c8;
  --o:#f59e0b;
  --g:#16a34a;
  --r:#dc2626;
  --t:#0f172a;
  --m:#64748b;
  --l:#e2e8f0;
  --bg:#f8fbff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(180deg,#f8fbff,#eef4f9);
  color:var(--t);
}

.hidden{display:none!important}

.topbar{
  background:linear-gradient(135deg,var(--b),var(--b2));
  color:white;
  padding:20px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom-left-radius:28px;
  box-shadow:0 16px 38px rgba(8,52,95,.22);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:64px;
  height:64px;
  background:white;
  border-radius:16px;
  padding:6px;
  object-fit:contain;
}

.brand h1{
  margin:0;
  font-size:27px;
  font-weight:900;
}

.brand p{
  margin:4px 0 0;
  color:#dbeafe;
  direction:ltr;
  font-size:12px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-family:Tahoma,Arial,sans-serif;
  font-weight:900;
  cursor:pointer;
}

.btn-white{background:white;color:var(--b)}
.btn-blue{background:linear-gradient(135deg,var(--b),var(--b2));color:white}
.btn-green{background:#dcfce7;color:#166534;border:1px solid #86efac}
.btn-red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.btn-orange{background:#fff7ed;color:#92400e;border:1px solid #fed7aa}

.main{
  width:94%;
  max-width:1450px;
  margin:26px auto;
}

.intro,
.panel,
.card,
.summary-card{
  background:white;
  border:1px solid var(--l);
  box-shadow:0 12px 30px rgba(15,23,42,.07);
}

.intro{
  border-radius:24px;
  padding:22px;
  text-align:center;
  margin-bottom:22px;
}

.intro h2{
  margin:0;
  color:var(--b);
  font-size:30px;
  font-weight:900;
}

.intro p{
  color:var(--m);
  line-height:1.8;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
}

.card{
  border-radius:28px;
  padding:24px 18px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.card:before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:100%;
  height:7px;
  background:linear-gradient(90deg,var(--o),#ffd28a);
}

.icon{
  width:78px;
  height:78px;
  margin:0 auto 16px;
  border-radius:26px;
  background:#eef6ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  color:var(--b);
}

.card h3{
  margin:0;
  color:var(--b);
  font-size:25px;
  font-weight:900;
}

.card h4{
  margin:7px 0 8px;
  color:var(--o);
  direction:ltr;
  font-size:12px;
}

.card p{
  color:var(--m);
  font-size:12.5px;
  line-height:1.8;
}

.pin-box{
  display:grid;
  grid-template-columns:1fr auto;
  gap:9px;
  margin-top:18px;
}

.pin-box input,
.panel input,
.panel select{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:10px;
  text-align:center;
  font-family:Tahoma,Arial,sans-serif;
  font-size:14px;
  font-weight:900;
  background:#f8fafc;
}

.pin-box button{
  border:0;
  border-radius:13px;
  padding:0 15px;
  background:linear-gradient(135deg,var(--b),var(--b2));
  color:white;
  font-weight:900;
}

.status-box{
  border-radius:20px;
  padding:15px;
  text-align:center;
  font-weight:900;
  margin-bottom:18px;
  line-height:1.8;
}

.status-available{background:#dcfce7;border:1px solid #86efac;color:#166534}
.status-unavailable{background:#fee2e2;border:1px solid #fecaca;color:#991b1b}
.status-delay{background:#fff7ed;border:1px solid #fed7aa;color:#92400e}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
  margin-bottom:18px;
}

.admin-summary{
  grid-template-columns:repeat(4,1fr);
}

.summary-card{
  border-radius:22px;
  padding:18px;
  text-align:center;
}

.summary-card h3{
  margin:0 0 8px;
  color:var(--m);
  font-size:13px;
}

.summary-card span{
  display:block;
  font-size:22px;
  font-weight:900;
  color:var(--b);
  direction:ltr;
}

.green span{color:var(--g)!important}
.orange span{color:var(--o)!important}
.red span{color:var(--r)!important}

.sections{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.panel{
  border-radius:24px;
  padding:18px;
}

.panel h2{
  margin:0 0 14px;
  color:var(--b);
  font-size:24px;
  font-weight:900;
}

.help{
  color:var(--m);
  font-size:12px;
  line-height:1.8;
  margin-bottom:12px;
}

.total-line{
  margin-top:14px;
  background:#eef6ff;
  border:1px solid #bfdbfe;
  border-radius:16px;
  padding:14px;
  text-align:center;
  font-weight:900;
  color:#1d4ed8;
}

.total-line span{
  display:block;
  margin-top:8px;
  font-size:28px;
  color:var(--b);
  direction:ltr;
}

.revenue-input{
  border:2px solid #bfdbfe!important;
  border-radius:18px!important;
  padding:16px!important;
  font-size:26px!important;
  color:var(--b);
  background:#f8fbff!important;
}

.status-result{
  margin-top:16px;
  border-radius:18px;
  padding:18px;
  text-align:center;
  font-weight:900;
  font-size:18px;
}

.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
.bad{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.more{background:#fff7ed;color:#92400e;border:1px solid #fed7aa}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:16px;
}

.actions button{
  padding:15px;
  border-radius:15px;
  font-size:14px;
}

.money-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:14px;
}

.money-card{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:20px;
  padding:14px;
  text-align:center;
}

.money-card img{
  width:100%;
  height:82px;
  object-fit:contain;
  margin-bottom:8px;
}

.money-card.no-img{
  background:linear-gradient(145deg,#fff7ed,#ffffff);
}

.money-card h3{
  margin:0;
  color:var(--b);
  font-size:16px;
  font-weight:900;
}

.counter{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.counter button{
  width:36px;
  height:36px;
  border-radius:10px;
  border:0;
  background:var(--b);
  color:white;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
}

.counter span{
  min-width:42px;
  font-size:20px;
  font-weight:900;
  direction:ltr;
}

.money-total{
  margin-top:8px;
  color:#334155;
  font-weight:900;
  direction:ltr;
  font-size:13px;
}

.calc-pad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.calc-pad button{
  font-size:18px;
  padding:16px;
}

.mini-card{
  border:1px solid var(--l);
  background:#f8fafc;
  border-radius:18px;
  padding:14px;
  margin-top:10px;
}

.detail-box{
  background:white;
  border:1px dashed #cbd5e1;
  padding:10px;
  border-radius:12px;
  margin-top:10px;
  font-size:13px;
  line-height:1.9;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-card{
  background:white;
  border-radius:24px;
  padding:24px;
  max-width:520px;
  width:100%;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.footer{
  width:90%;
  max-width:1200px;
  margin:45px auto 20px;
  padding-top:18px;
  border-top:1px solid #dbe4ee;
  text-align:center;
  color:#64748b;
  font-size:14px;
}

@media(max-width:1100px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .summary-grid,.admin-summary{grid-template-columns:repeat(2,1fr)}
  .sections{grid-template-columns:1fr}
  .money-grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:650px){
  .topbar{flex-direction:column;text-align:center;gap:12px}
  .brand{flex-direction:column}
  .cards,.summary-grid,.admin-summary,.actions{grid-template-columns:1fr}
  .money-grid{grid-template-columns:1fr}
  .calc-pad{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">
    <img src="logo.png" class="logo">
    <div>
      <h1>إدارة النقدية</h1>
      <p>Cash Management</p>
    </div>
  </div>

  <button class="btn btn-white" onclick="location.href='index.html'">
    الرئيسية
  </button>
</div>

<div class="main">
