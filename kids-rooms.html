<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجز غرف الأطفال</title>

<style>
:root{
  --blue:#005b9f;
  --blue2:#0077c8;
  --navy:#06345d;
  --orange:#f59e0b;
  --bg:#f4f8fc;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  direction:rtl;
  background:
    radial-gradient(circle at 90% 8%, rgba(0,119,200,.12), transparent 28%),
    radial-gradient(circle at 10% 70%, rgba(245,158,11,.10), transparent 25%),
    linear-gradient(180deg,#f9fcff,#eef4f9);
  color:var(--text);
}

/* HEADER */
.topbar{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  padding:20px 36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  box-shadow:0 18px 42px rgba(8,52,95,.22);
  border-bottom-left-radius:30px;
  border-bottom-right-radius:30px;
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  width:76px;
  height:76px;
  object-fit:contain;
  background:white;
  border-radius:20px;
  padding:8px;
  box-shadow:0 12px 26px rgba(0,0,0,.20);
}

.brand h1{
  margin:0;
  font-size:27px;
  font-weight:900;
}

.brand p{
  margin:5px 0 0;
  direction:ltr;
  font-size:13px;
  color:#dbeafe;
}

.home-btn{
  background:white;
  color:var(--blue);
  border:none;
  padding:12px 20px;
  border-radius:14px;
  cursor:pointer;
  font-weight:900;
  box-shadow:0 10px 22px rgba(0,0,0,.14);
}

/* LAYOUT */
.main{
  width:96%;
  max-width:1500px;
  margin:26px auto;
}

.controls-card{
  background:rgba(255,255,255,.92);
  border-radius:24px;
  padding:18px 20px;
  box-shadow:0 14px 34px rgba(15,23,42,.08);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.floor-title{
  margin:0;
  color:var(--blue);
  font-size:24px;
  font-weight:900;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.controls button{
  padding:11px 22px;
  border:none;
  background:#eef6ff;
  color:var(--blue);
  border:1px solid #cfe8ff;
  border-radius:999px;
  cursor:pointer;
  font-weight:900;
  transition:.2s;
}

.controls button.active,
.controls button:hover{
  background:var(--blue);
  color:white;
}

/* LEGEND */
.legend{
  margin:18px 0;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

.legend-item{
  padding:7px 11px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  border:1px solid rgba(15,23,42,.08);
  box-shadow:0 5px 12px rgba(15,23,42,.06);
}

/* SCHEDULE */
.schedule-box{
  background:white;
  border-radius:26px;
  box-shadow:0 18px 44px rgba(15,23,42,.10);
  overflow:hidden;
  border:1px solid var(--border);
  margin-bottom:22px;
}

.box-title{
  background:linear-gradient(90deg,var(--orange),#ffbd4a);
  color:white;
  padding:16px 22px;
  font-size:21px;
  font-weight:900;
  text-align:center;
}

.table-actions{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:14px;
  background:#fff8ed;
  border-bottom:1px solid #fed7aa;
}

.table-actions button{
  padding:10px 16px;
  border:none;
  background:white;
  color:#075985;
  border:1px solid #bae6fd;
  border-radius:12px;
  cursor:pointer;
  font-weight:900;
  box-shadow:0 5px 12px rgba(15,23,42,.06);
}

.period-title{
  background:linear-gradient(90deg,var(--blue),var(--blue2));
  color:white;
  padding:13px 18px;
  font-size:18px;
  font-weight:900;
  text-align:center;
}

.table-wrap{
  width:100%;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  background:white;
}

th{
  background:#f8fbff;
  color:var(--blue);
  padding:12px 6px;
  font-size:14px;
  border:1px solid #d7e3ef;
  font-weight:900;
}

td{
  border:1px solid #d7e3ef;
  height:78px;
  text-align:center;
  background:white;
  padding:6px;
  vertical-align:middle;
}

.day{
  background:#eef6ff;
  font-weight:900;
  width:95px;
  color:var(--blue);
  font-size:15px;
}

.time{
  direction:ltr;
  font-size:13px;
  color:var(--navy);
}

.slot{
  margin-bottom:5px;
  border-radius:10px;
  padding:3px;
  transition:.2s;
}

select{
  width:100%;
  height:34px;
  border-radius:9px;
  border:1px solid #cbd5e1;
  font-size:13px;
  font-weight:900;
  font-family:Tahoma,Arial;
  text-align:center;
  background:white;
  color:#0f172a;
  cursor:pointer;
}

.footer-note{
  text-align:center;
  color:#64748b;
  font-weight:900;
  margin:18px;
}

@media(max-width:850px){
  .topbar{
    flex-direction:column;
    text-align:center;
  }

  .brand{
    flex-direction:column;
  }

  .home-btn{
    width:100%;
  }

  .controls-card{
    justify-content:center;
    text-align:center;
  }

  table{
    min-width:900px;
  }

  .table-wrap{
    overflow-x:auto;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">
    <img src="logo.png" class="logo" alt="Akaz Logo">
    <div>
      <h1>حجز غرف الأطفال</h1>
      <p>Pediatric Rooms Booking</p>
    </div>
  </div>

  <button class="home-btn" onclick="goHome()">🏠 الرئيسية</button>
</div>

<div class="main">

  <div class="controls-card">
    <h2 id="floorTitle" class="floor-title">غرفة الدور الأول</h2>

    <div class="controls">
      <button id="floor1Btn" class="active" onclick="switchFloor(1)">غرفة الدور الأول</button>
      <button id="floor2Btn" onclick="switchFloor(2)">غرفة الدور الثاني</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="schedule-box">
    <div class="box-title">جدول حجز الغرفة الأسبوعي</div>

    <div class="table-actions">
      <button onclick="copySmart('السبت')">نسخ السبت إلى الاثنين والأربعاء</button>
      <button onclick="copySmart('الأحد')">نسخ الأحد إلى الثلاثاء والخميس</button>
    </div>

    <div id="tablesArea"></div>
  </div>

  <div class="footer-note">
    كل وقت يسمح بأخصائيين — وأي تعديل يتم حفظه تلقائيًا ويظهر للجميع
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyArYShiKgAnblA4aDEIr7zAM2q7oHbATJQ",
  authDomain: "akazcenter-89c17.firebaseapp.com",
  projectId: "akazcenter-89c17",
  storageBucket: "akazcenter-89c17.firebasestorage.app",
  messagingSenderId: "576111794528",
  appId: "1:576111794528:web:b7ee436f5bd0b60c4a6605"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const roomsRef = collection(db, "kidsRooms");

window.goHome = function(){
  window.location.href = "index.html";
};

let currentFloor = 1;
let savedData = {};

const therapists = {
  "—":"#ffffff",
  "د. ريناد حميد":"#fca5a5",
  "د. ابتسام سويلم":"#fdba74",
  "د. سلمى فرحان":"#fde68a",
  "د. هند فهيد":"#bbf7d0",
  "د. أسماء فهيد":"#a5f3fc",
  "د. مها فريح":"#bfdbfe",
  "د. حاتم الاحمدي":"#c7d2fe",
  "د. عبدالرحمن السويداء":"#ddd6fe",
  "د. عبدالرحمن السليمي":"#fbcfe8",
  "د. عبدالعزيز الحمدان":"#fecaca"
};

const days = ["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];

const morningTimes = [
  "09:00 AM",
  "10:00 AM",
  "11:00 AM",
  "12:00 PM",
  "01:00 PM",
  "02:00 PM"
];

const eveningTimes = [
  "03:00 PM",
  "04:00 PM",
  "05:00 PM",
  "06:00 PM",
  "07:00 PM",
  "08:00 PM",
  "09:00 PM"
];

const allTimes = [...morningTimes, ...eveningTimes];

function makeId(floor, day, time, slot){
  return `floor${floor}_${day}_${time}_${slot}`
    .replaceAll(" ","_")
    .replaceAll(":","-");
}

function buildLegend(){
  const legend = document.getElementById("legend");
  legend.innerHTML = "";

  for(let name in therapists){
    if(name === "—") continue;
    legend.innerHTML += `<div class="legend-item" style="background:${therapists[name]}">${name}</div>`;
  }
}

function buildTables(){
  const area = document.getElementById("tablesArea");
  area.innerHTML = "";

  area.innerHTML += buildTableSection("الفترة الصباحية", morningTimes);
  area.innerHTML += buildTableSection("الفترة المسائية", eveningTimes);

  document.querySelectorAll("select").forEach(select => {
    colorCell(select);
  });
}

function buildTableSection(title, timeList){
  let html = `
    <div class="period-title">${title}</div>
    <div class="table-wrap">
      <table>
        <tr>
          <th class="day">اليوم</th>
  `;

  timeList.forEach(time => {
    html += `<th class="time">${time}</th>`;
  });

  html += `</tr>`;

  days.forEach(day => {
    html += `<tr><td class="day">${day}</td>`;

    timeList.forEach(time => {
      html += `<td>`;

      for(let slot = 1; slot <= 2; slot++){
        const cellId = makeId(currentFloor, day, time, slot);
        const value = savedData[cellId]?.therapist || "—";
        html += `<div class="slot">${createDropdown(cellId, value)}</div>`;
      }

      html += `</td>`;
    });

    html += `</tr>`;
  });

  html += `
      </table>
    </div>
  `;

  return html;
}

function createDropdown(cellId, value){
  let options = "";

  for(let name in therapists){
    const selected = name === value ? "selected" : "";
    options += `<option value="${name}" ${selected}>${name}</option>`;
  }

  return `<select data-id="${cellId}" onchange="saveRoomBooking(this)">${options}</select>`;
}

function colorCell(select){
  const color = therapists[select.value] || "#ffffff";
  const slot = select.parentElement;
  slot.style.background = color;

  if(select.value === "—"){
    slot.style.background = "#ffffff";
    select.style.color = "#0f172a";
  }else{
    select.style.color = "#000";
    select.style.fontWeight = "900";
  }
}

window.saveRoomBooking = async function(select){
  const id = select.dataset.id;
  const therapist = select.value;

  colorCell(select);

  if(therapist === "—"){
    await deleteDoc(doc(db, "kidsRooms", id));
    return;
  }

  await setDoc(doc(db, "kidsRooms", id), {
    id,
    floor: currentFloor,
    therapist,
    updatedAt: new Date()
  });
};

window.copySmart = async function(sourceDay){
  let targetDays = [];

  if(sourceDay === "السبت"){
    targetDays = ["الاثنين","الأربعاء"];
  }

  if(sourceDay === "الأحد"){
    targetDays = ["الثلاثاء","الخميس"];
  }

  if(targetDays.length === 0) return;

  if(!confirm(`هل تريد نسخ حجوزات ${sourceDay} إلى ${targetDays.join(" و ")}؟`)) return;

  const writes = [];

  for(const time of allTimes){
    for(let slot = 1; slot <= 2; slot++){
      const sourceId = makeId(currentFloor, sourceDay, time, slot);
      const therapist = savedData[sourceId]?.therapist || "—";

      for(const targetDay of targetDays){
        const targetId = makeId(currentFloor, targetDay, time, slot);

        if(therapist === "—"){
          writes.push(deleteDoc(doc(db, "kidsRooms", targetId)));
        }else{
          writes.push(setDoc(doc(db, "kidsRooms", targetId), {
            id: targetId,
            floor: currentFloor,
            therapist,
            updatedAt: new Date()
          }));
        }
      }
    }
  }

  await Promise.all(writes);
  alert("تم النسخ بنجاح");
};

window.switchFloor = function(floor){
  currentFloor = floor;

  document.getElementById("floorTitle").innerText =
    floor === 1 ? "غرفة الدور الأول" : "غرفة الدور الثاني";

  document.getElementById("floor1Btn").classList.toggle("active", floor === 1);
  document.getElementById("floor2Btn").classList.toggle("active", floor === 2);

  buildTables();
};

function listenRooms(){
  onSnapshot(roomsRef, (snapshot) => {
    savedData = {};

    snapshot.forEach(item => {
      savedData[item.id] = item.data();
    });

    buildTables();
  });
}

buildLegend();
listenRooms();
</script>

</body>
</html>
