<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>حجز غرف الأطفال</title>

<style>
body {
    font-family: Tahoma, Arial;
    direction: rtl;
    background: #eef3f8;
    margin: 0;
    padding: 0;
}

.header {
    background: #005b9f;
    color: white;
    padding: 18px 30px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.home-btn {
    position: absolute;
    top: 15px;
    left: 20px;
    background: white;
    color: #005b9f;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px;
}

button {
    padding: 10px 25px;
    border: none;
    background: #005b9f;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.table-wrap {
    width: 96%;
    margin: auto;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th {
    background: #005b9f;
    color: white;
    padding: 10px;
}

td {
    border: 1px solid #ccc;
    height: 55px;
    text-align: center;
}

.time {
    background: #dbeafe;
    font-weight: bold;
    width: 120px;
}

select {
    width: 98%;
    height: 40px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
}
</style>
</head>

<body>

<button onclick="goHome()" class="home-btn">🏠 الرئيسية</button>

<div class="header">حجز غرف الأطفال</div>

<div class="controls">
    <button onclick="switchFloor(1)">الدور الأول</button>
    <button onclick="switchFloor(2)">الدور الثاني</button>
</div>

<h3 id="floorTitle" style="text-align:center;">الدور الأول</h3>

<div class="table-wrap">
    <table id="schedule"></table>
</div>

<script>

function goHome() {
    window.location.href = "index.html";
}

const therapists = {
    "—": "#ffffff",
    "د. ريناد حميد": "#fca5a5",
    "د. ابتسام سويلم": "#fdba74",
    "د. سلمى فرحان": "#fde68a",
    "د. هند فهيد": "#bbf7d0",
    "د. أسماء فهيد": "#a5f3fc",
    "د. مها فريح": "#bfdbfe",
    "د. حاتم الاحمدي": "#c7d2fe",
    "د. عبدالرحمن السويداء": "#ddd6fe",
    "د. عبدالرحمن السليمي": "#fbcfe8",
    "د. عبدالعزيز الحمدان": "#fecaca"
};

const days = ["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];

const times = [
    "09:00 AM","10:00 AM","11:00 AM","12:00 PM",
    "01:00 PM","02:00 PM","03:00 PM","04:00 PM",
    "05:00 PM","06:00 PM","07:00 PM","08:00 PM","09:00 PM"
];

function buildTable() {
    let table = document.getElementById("schedule");
    table.innerHTML = "";

    let header = "<tr><th>الوقت</th>";
    days.forEach(d => header += `<th>${d}</th>`);
    header += "</tr>";
    table.innerHTML += header;

    times.forEach(time => {
        let row = `<tr><td class="time">${time}</td>`;

        days.forEach(() => {
            row += `<td>${createDropdown()}</td>`;
        });

        row += "</tr>";
        table.innerHTML += row;
    });
}

function createDropdown() {
    let options = "";
    for (let name in therapists) {
        options += `<option value="${name}">${name}</option>`;
    }

    return `<select onchange="colorCell(this)">${options}</select>`;
}

function colorCell(select) {
    const color = therapists[select.value];
    const cell = select.parentElement;

    cell.style.background = color;

    if (select.value !== "—") {
        select.style.fontWeight = "bold";
    } else {
        cell.style.background = "#ffffff";
    }
}

function switchFloor(floor) {
    document.getElementById("floorTitle").innerText =
        floor === 1 ? "الدور الأول" : "الدور الثاني";
    buildTable();
}

buildTable();

</script>

</body>
</html>
