<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجز غرف الأطفال</title>

<style>
:root{
  --blue:#005b9f;
  --blue2:#0077c8;
  --orange:#f59e0b;
  --text:#0f172a;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  direction:rtl;
  background:linear-gradient(180deg,#f8fbff,#eef4f9);
  color:var(--text);
}

.topbar{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  padding:18px 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  box-shadow:0 14px 35px rgba(8,52,95,.20);
  border-bottom-left-radius:28px;
  border-bottom-right-radius:28px;
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  width:72px;
  height:72px;
  object-fit:contain;
  background:white;
  border-radius:18px;
  padding:7px;
  box-shadow:0 10px 22px rgba(0,0,0,.20);
}

.brand h1{
  margin:0;
  font-size:26px;
  font-weight:900;
}

.brand p{
  margin:5px 0 0;
  direction:ltr;
  font-size:13px;
  color:#dbeafe;
}

.home-btn{
  background:white;
  color:var(--blue);
  border:none;
  padding:11px 18px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.main{
  width:96%;
  max-width:1500px;
  margin:26px auto;
}

.controls-card{
  background:white;
  border-radius:22px;
  padding:18px;
  box-shadow:0 12px 28px rgba(15,23,42,.08);
  border:1px solid #e2e8f0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.floor-title{
  margin:0;
  color:var(--blue);
  font-size:24px;
  font-weight:900;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.controls button{
  padding:11px 24px;
  border:none;
  background:var(--blue);
  color:white;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.legend{
  margin:18px 0;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

.legend-item{
  padding:8px 13px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
  border:1px solid #e2e8f0;
}

.schedule-box{
  background:white;
  border-radius:24px;
  box-shadow:0 16px 38px rgba(15,23,42,.10);
  overflow:hidden;
  border:1px solid #e2e8f0;
}

.box-title{
  background:linear-gradient(90deg,var(--orange),#ffbd4a);
  color:white;
  padding:15px 20px;
  font-size:21px;
  font-weight:900;
  text-align:center;
}

.table-actions{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:14px;
  background:#fff7ed;
  border-bottom:1px solid #fed7aa;
}

.table-actions button{
  padding:9px 15px;
  border:none;
  background:#e0f2fe;
  color:#075985;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:980px;
  background:white;
}

th{
  background:var(--blue);
  color:white;
  padding:13px;
  font-size:15px;
  border:1px solid #0b66a9;
}

td{
  border:1px solid #d7dee8;
  min-height:70px;
  text-align:center;
  background:white;
  padding:7px;
  vertical-align:middle;
}

.time{
  background:#eef6ff;
  font-weight:900;
  width:120px;
  color:var(--blue);
  direction:ltr;
}

.slot{
  margin-bottom:6px;
  border-radius:10px;
  padding:3px;
}

select{
  width:98%;
  height:40px;
  border-radius:10px;
  border:1px solid #cbd5e1;
  font-size:15px;
  font-weight:bold;
  font-family:Tahoma,Arial;
  text-align:center;
  background:white;
  color:#0f172a;
  cursor:pointer;
}

.footer-note{
  text-align:center;
  color:#b91c1c;
  font-weight:bold;
  margin:18px;
}

@media(max-width:850px){
  .topbar{
    flex-direction:column;
    text-align:center;
  }

  .brand{
    flex-direction:column;
  }

  .home-btn{
    width:100%;
  }

  .controls-card{
    justify-content:center;
    text-align:center;
  }

  table{
    min-width:1050px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">
    <img src="logo.png" class="logo" alt="Akaz Logo">
    <div>
      <h1>حجز غرف الأطفال</h1>
      <p>Pediatric Rooms Booking</p>
    </div>
  </div>

  <button class="home-btn" onclick="goHome()">🏠 الرئيسية</button>
</div>

<div class="main">

  <div class="controls-card">
    <h2 id="floorTitle" class="floor-title">غرفة الدور الأرضي</h2>

    <div class="controls">
      <button onclick="switchFloor(1)">غرفة الدور الأرضي</button>
      <button onclick="switchFloor(2)">غرفة الدور الثاني</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="schedule-box">
    <div class="box-title">جدول حجز الغرفة الأسبوعي</div>

    <div class="table-actions">
      <button onclick="copySmart('السبت')">نسخ السبت إلى الاثنين والأربعاء</button>
      <button onclick="copySmart('الأحد')">نسخ الأحد إلى الثلاثاء والخميس</button>
    </div>

    <div class="table-wrap">
      <table id="schedule"></table>
    </div>
  </div>

  <div class="footer-note">
    كل وقت يسمح بأخصائيين — وأي تعديل يتم حفظه تلقائيًا ويظهر للجميع
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyArYShiKgAnblA4aDEIr7zAM2q7oHbATJQ",
  authDomain: "akazcenter-89c17.firebaseapp.com",
  projectId: "akazcenter-89c17",
  storageBucket: "akazcenter-89c17.firebasestorage.app",
  messagingSenderId: "576111794528",
  appId: "1:576111794528:web:b7ee436f5bd0b60c4a6605"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const roomsRef = collection(db, "kidsRooms");

window.goHome = function(){
  window.location.href = "index.html";
};

let currentFloor = 1;
let savedData = {};

const therapists = {
  "—":"#ffffff",
  "د. ريناد حميد":"#fca5a5",
  "د. ابتسام سويلم":"#fdba74",
  "د. سلمى فرحان":"#fde68a",
  "د. هند فهيد":"#bbf7d0",
  "د. أسماء فهيد":"#a5f3fc",
  "د. مها فريح":"#bfdbfe",
  "د. حاتم الاحمدي":"#c7d2fe",
  "د. عبدالرحمن السويداء":"#ddd6fe",
  "د. عبدالرحمن السليمي":"#fbcfe8",
  "د. عبدالعزيز الحمدان":"#fecaca"
};

const days = ["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];

const times = [
  "09:00 AM","10:00 AM","11:00 AM","12:00 PM",
  "01:00 PM","02:00 PM","03:00 PM","04:00 PM",
  "05:00 PM","06:00 PM","07:00 PM","08:00 PM","09:00 PM"
];

function makeId(floor, day, time, slot){
  return `floor${floor}_${day}_${time}_${slot}`
    .replaceAll(" ","_")
    .replaceAll(":","-");
}

function buildLegend(){
  const legend = document.getElementById("legend");
  legend.innerHTML = "";

  for(let name in therapists){
    if(name === "—") continue;
    legend.innerHTML += `<div class="legend-item" style="background:${therapists[name]}">${name}</div>`;
  }
}

function buildTable(){
  const table = document.getElementById("schedule");
  table.innerHTML = "";

  let header = "<tr><th>الوقت</th>";
  days.forEach(day => header += `<th>${day}</th>`);
  header += "</tr>";
  table.innerHTML += header;

  times.forEach(time => {
    let row = `<tr><td class="time">${time}</td>`;

    days.forEach(day => {
      row += `<td>`;

      for(let slot = 1; slot <= 2; slot++){
        const cellId = makeId(currentFloor, day, time, slot);
        const value = savedData[cellId]?.therapist || "—";
        row += `<div class="slot">${createDropdown(cellId, value)}</div>`;
      }

      row += `</td>`;
    });

    row += "</tr>";
    table.innerHTML += row;
  });

  document.querySelectorAll("select").forEach(select => {
    colorCell(select);
  });
}

function createDropdown(cellId, value){
  let options = "";

  for(let name in therapists){
    const selected = name === value ? "selected" : "";
    options += `<option value="${name}" ${selected}>${name}</option>`;
  }

  return `<select data-id="${cellId}" onchange="saveRoomBooking(this)">${options}</select>`;
}

function colorCell(select){
  const color = therapists[select.value] || "#ffffff";
  const slot = select.parentElement;
  slot.style.background = color;

  if(select.value === "—"){
    slot.style.background = "#ffffff";
    select.style.color = "#0f172a";
  }else{
    select.style.color = "#000";
    select.style.fontWeight = "bold";
  }
}

window.saveRoomBooking = async function(select){
  const id = select.dataset.id;
  const therapist = select.value;

  colorCell(select);

  if(therapist === "—"){
    await deleteDoc(doc(db, "kidsRooms", id));
    return;
  }

  await setDoc(doc(db, "kidsRooms", id), {
    id,
    floor: currentFloor,
    therapist,
    updatedAt: new Date()
  });
};

window.copySmart = async function(sourceDay){
  let targetDays = [];

  if(sourceDay === "السبت"){
    targetDays = ["الاثنين","الأربعاء"];
  }

  if(sourceDay === "الأحد"){
    targetDays = ["الثلاثاء","الخميس"];
  }

  if(targetDays.length === 0) return;

  if(!confirm(`هل تريد نسخ حجوزات ${sourceDay} إلى ${targetDays.join(" و ")}؟`)) return;

  const writes = [];

  for(const time of times){
    for(let slot = 1; slot <= 2; slot++){
      const sourceId = makeId(currentFloor, sourceDay, time, slot);
      const therapist = savedData[sourceId]?.therapist || "—";

      for(const targetDay of targetDays){
        const targetId = makeId(currentFloor, targetDay, time, slot);

        if(therapist === "—"){
          writes.push(deleteDoc(doc(db, "kidsRooms", targetId)));
        }else{
          writes.push(setDoc(doc(db, "kidsRooms", targetId), {
            id: targetId,
            floor: currentFloor,
            therapist,
            updatedAt: new Date()
          }));
        }
      }
    }
  }

  await Promise.all(writes);
  alert("تم النسخ بنجاح");
};

window.switchFloor = function(floor){
  currentFloor = floor;

  document.getElementById("floorTitle").innerText =
    floor === 1 ? "غرفة الدور الأول" : "غرفة الدور الثاني";

  buildTable();
};

function listenRooms(){
  onSnapshot(roomsRef, (snapshot) => {
    savedData = {};

    snapshot.forEach(item => {
      savedData[item.id] = item.data();
    });

    buildTable();
  });
}

buildLegend();
listenRooms();
</script>

</body>
</html>
