<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>بوابة مركز عكاز</title>

<style>
body {
    font-family: Arial;
    direction: rtl;
    text-align: center;
    background: #f3f6fb;
}

h1 {
    margin-top: 40px;
    color: #1e3a8a;
}

.container {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 50px;
    flex-wrap: wrap;
}

.card {
    width: 220px;
    height: 150px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
    background: #1e3a8a;
    color: white;
}
</style>

</head>

<body>

<h1>بوابة مركز عكاز</h1>

<div class="container">

    <div class="card" onclick="go('work-schedule.html')">
        جدول الدوام
    </div>

    <div class="card" onclick="go('kids-rooms.html')">
        غرف الأطفال
    </div>

    <div class="card" onclick="go('hydrotherapy.html')">
        العلاج المائي
    </div>

</div>

<script>
function go(page) {
    window.location.href = page;
}
</script>

</body>
</html>
