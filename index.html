<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز عكاز</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  direction:rtl;
  background:#f5f8fc;
}

/* الهيدر */
.hero{
  background:linear-gradient(135deg,#005b9f,#0077c8);
  color:white;
  padding:40px 0 70px;
  border-bottom-left-radius:40px;
  border-bottom-right-radius:40px;
}

/* توزيع */
.hero-inner{
  width:100%;
  padding:0 40px;
  display:grid;
  grid-template-columns:170px 1fr 170px;
  align-items:center;
}

/* الساعة */
.clock-card{
  justify-self:start;
  width:170px;
  height:170px;
  background:rgba(255,255,255,.12);
  border-radius:25px;
  text-align:center;
  padding:10px;
}

.clock-circle{
  width:100px;
  height:100px;
  margin:auto;
  border-radius:50%;
  background:#004b85;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
}

#clockTime{
  font-size:20px;
  direction:ltr;
}

#clockDateAr{
  margin-top:10px;
  font-size:14px;
}

/* النص */
.center{
  text-align:center;
}

.center h1{
  margin:0;
  font-size:32px;
}

.center p{
  margin-top:10px;
  font-size:14px;
}

/* اللوقو */
.logo-box{
  justify-self:end;
  width:170px;
  height:170px;
  background:white;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  width:130px;
}

/* العبارة */
.quote{
  background:white;
  width:80%;
  margin:-30px auto 30px;
  padding:15px;
  border-radius:20px;
  text-align:center;
  font-weight:bold;
}

/* الأقسام */
.cards{
  display:flex;
  justify-content:center;
  gap:20px;
}

.card{
  width:180px;
  height:140px;
  background:white;
  border-radius:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 10px 20px rgba(0,0,0,.1);
}

.card:hover{
  transform:translateY(-5px);
}

.card h3{
  margin:0;
}

.card span{
  font-size:12px;
  color:orange;
}
</style>
</head>

<body>

<div class="hero">
  <div class="hero-inner">

    <!-- الساعة -->
    <div class="clock-card">
      <div class="clock-circle">
        <div id="clockTime">00:00</div>
      </div>
      <div id="clockDateAr">--</div>
    </div>

    <!-- النص -->
    <div class="center">
      <h1>مركز عكاز للعلاج الطبيعي</h1>
      <p>بوابة داخلية لإدارة أنظمة المركز</p>
    </div>

    <!-- اللوقو -->
    <div class="logo-box">
      <img src="logo.png" class="logo">
    </div>

  </div>
</div>

<div class="quote" id="quote">
  نحن هنا لنخفف الألم ونصنع الفرق
</div>

<div class="cards">

  <div class="card" onclick="go('work-schedule.html')">
    <h3>جدول الدوام</h3>
    <span>Work</span>
  </div>

  <div class="card" onclick="go('kids-rooms.html')">
    <h3>غرف الأطفال</h3>
    <span>Kids</span>
  </div>

  <div class="card" onclick="go('hydrotherapy.html')">
    <h3>العلاج المائي</h3>
    <span>Hydro</span>
  </div>

  <div class="card" onclick="go('home-visits.html')">
    <h3>الزيارات المنزلية</h3>
    <span>Visits</span>
  </div>

</div>

<script>
function go(page){
  window.location.href = page;
}

/* الساعة */
function updateClock(){
  const now = new Date();
  document.getElementById("clockTime").innerText =
    now.toLocaleTimeString("en-GB");

  document.getElementById("clockDateAr").innerText =
    now.toLocaleDateString("ar-SA");
}
setInterval(updateClock,1000);
updateClock();

/* العبارات */
const quotes = [
"نحن هنا لنخفف الألم ونصنع الفرق",
"هدفنا راحة المريض",
"كل مريض أمانة",
"العلاج يبدأ بالاهتمام",
"ابتسامتك علاج"
];

let i=0;
setInterval(()=>{
  document.getElementById("quote").innerText=quotes[i];
  i=(i+1)%quotes.length;
},4000);
</script>

</body>
</html>
