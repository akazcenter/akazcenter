<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز عكاز للعلاج الطبيعي</title>

<style>
:root{
  --blue:#005b9f;
  --blue2:#0077c8;
  --dark:#08345f;
  --orange:#f59e0b;
  --text:#0f172a;
  --muted:#64748b;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  direction:rtl;
  background:linear-gradient(180deg,#f8fbff,#eef4f9);
  color:var(--text);
}

.hero{
  position:relative;
  min-height:330px;
  background:linear-gradient(135deg,#005b9f,#0077c8);
  color:white;
  overflow:hidden;
  border-bottom-left-radius:42px;
  border-bottom-right-radius:42px;
  box-shadow:0 18px 45px rgba(8,52,95,.22);
}

.hero-inner{
  width:100%;
  padding:45px 55px;
  display:grid;
  grid-template-columns:190px 1fr 190px;
  align-items:center;
  gap:25px;
}

.theme-btn{
  position:absolute;
  top:20px;
  left:24px;
  z-index:10;
  background:white;
  color:var(--blue);
  border:none;
  width:48px;
  height:48px;
  border-radius:16px;
  cursor:pointer;
  font-size:22px;
  font-weight:bold;
  box-shadow:0 10px 25px rgba(0,0,0,.18);
}

.clock-card{
  justify-self:start;
  width:175px;
  height:175px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.24);
  border-radius:28px;
  padding:14px;
  text-align:center;
  backdrop-filter:blur(10px);
  box-shadow:0 18px 35px rgba(0,0,0,.18);
}

.clock-circle{
  width:105px;
  height:105px;
  margin:0 auto;
  border-radius:50%;
  background:linear-gradient(145deg,#063b72,#0077c8);
  border:3px solid rgba(255,255,255,.22);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.08),0 12px 25px rgba(0,0,0,.25);
}

#clockTime{
  direction:ltr;
  font-size:21px;
  font-weight:900;
}

.live-label{
  color:#fbbf24;
  font-size:11px;
  margin-top:4px;
  font-weight:bold;
}

#clockDateAr{
  margin-top:12px;
  font-weight:bold;
  font-size:13px;
}

#clockDateEn{
  margin-top:4px;
  direction:ltr;
  font-size:12px;
  color:#dbeafe;
}

.center-title{
  text-align:center;
}

.center-title h1{
  margin:0;
  font-size:42px;
  font-weight:900;
  line-height:1.5;
}

.logo-box{
  justify-self:end;
  width:175px;
  height:175px;
  background:white;
  border-radius:28px;
  padding:14px;
  box-shadow:0 18px 35px rgba(0,0,0,.25);
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  width:140px;
  height:140px;
  object-fit:contain;
}

.quote-strip{
  width:88%;
  max-width:1000px;
  margin:-35px auto 32px;
  position:relative;
  z-index:5;
  background:white;
  border-radius:24px;
  padding:22px 28px;
  box-shadow:0 18px 45px rgba(15,23,42,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  border:1px solid #e2e8f0;
}

.quote-icon{
  color:var(--orange);
  font-size:25px;
}

#dailyQuote{
  margin:0;
  color:var(--dark);
  font-size:23px;
  font-weight:900;
  text-align:center;
  transition:.35s;
}

.main{
  width:90%;
  max-width:1250px;
  margin:0 auto 28px;
}

.section-head{
  text-align:center;
  margin-bottom:24px;
}

.section-head h2{
  color:var(--blue);
  margin:0;
  font-size:30px;
  font-weight:900;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:24px;
}

.card{
  position:relative;
  background:linear-gradient(180deg,#ffffff,#fbfdff);
  border:1px solid #e2e8f0;
  border-radius:28px;
  padding:28px 20px;
  min-height:170px;
  cursor:pointer;
  overflow:hidden;
  text-align:center;
  box-shadow:0 18px 35px rgba(15,23,42,.08);
  transition:.28s ease;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  height:7px;
  width:100%;
  background:linear-gradient(90deg,var(--orange),#ffbd4a);
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 26px 55px rgba(15,23,42,.16);
}

.icon{
  width:66px;
  height:66px;
  border-radius:22px;
  background:linear-gradient(145deg,#eef6ff,#ffffff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  margin:0 auto 18px;
}

.card h3{
  color:var(--blue);
  font-size:23px;
  margin:0;
  font-weight:900;
}

.card h4{
  color:var(--orange);
  direction:ltr;
  text-align:center;
  font-size:14px;
  margin:8px 0 0;
}

.footer{
  width:90%;
  max-width:1250px;
  margin:38px auto 22px;
  padding-top:18px;
  border-top:1px solid #dbe4ee;
  text-align:center;
  color:#7b8796;
  font-size:14px;
}

/* DARK MODE */
body.dark{
  background:linear-gradient(180deg,#020617,#0f172a);
  color:#e2e8f0;
}

body.dark .hero{
  background:linear-gradient(135deg,#020617,#1e3a8a);
}

body.dark .clock-card{
  background:rgba(15,23,42,.65);
  border-color:#334155;
}

body.dark .clock-circle{
  background:linear-gradient(145deg,#020617,#1e40af);
}

body.dark .quote-strip,
body.dark .card{
  background:#1e293b;
  border-color:#334155;
  box-shadow:0 18px 35px rgba(0,0,0,.25);
}

body.dark #dailyQuote,
body.dark .card h3,
body.dark .section-head h2{
  color:#93c5fd;
}

body.dark .footer{
  color:#cbd5e1;
}

body.dark .icon{
  background:#0f172a;
}

body.dark .theme-btn{
  background:#0f172a;
  color:#fbbf24;
  border:1px solid #334155;
}

/* RESPONSIVE */
@media(max-width:1100px){
  .hero-inner{
    grid-template-columns:1fr;
    text-align:center;
  }

  .clock-card,
  .logo-box{
    justify-self:center;
  }

  .center-title h1{
    font-size:32px;
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  .hero-inner{
    padding:80px 20px 50px;
  }

  .center-title h1{
    font-size:25px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  #dailyQuote{
    font-size:18px;
  }

  .quote-strip{
    width:92%;
  }
}
</style>
</head>

<body>

<header class="hero">

  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>

  <div class="hero-inner">

    <div class="clock-card">
      <div class="clock-circle">
        <div id="clockTime">00:00:00</div>
        <div class="live-label">Live Time</div>
      </div>
      <div id="clockDateAr">--</div>
      <div id="clockDateEn">--</div>
    </div>

    <div class="center-title">
      <h1>مركز عكاز للعلاج الطبيعي</h1>
    </div>

    <div class="logo-box">
      <img src="logo.png" class="logo" alt="شعار مركز عكاز">
    </div>

  </div>
</header>

<section class="quote-strip">
  <span class="quote-icon">💙</span>
  <h2 id="dailyQuote">نحن هنا لنخفف الألم ونصنع الفرق</h2>
</section>

<main class="main">

  <div class="section-head">
    <h2>أقسام المركز</h2>
  </div>

  <div class="cards">

    <div class="card" onclick="go('work-schedule.html')">
      <div class="icon">📋</div>
      <h3>جدول الدوام</h3>
      <h4>Work Schedule</h4>
    </div>

    <div class="card" onclick="go('kids-rooms.html')">
      <div class="icon">👶</div>
      <h3>غرف الأطفال</h3>
      <h4>Pediatric Rooms</h4>
    </div>

    <div class="card" onclick="go('hydrotherapy.html')">
      <div class="icon">💧</div>
      <h3>العلاج المائي</h3>
      <h4>Hydrotherapy</h4>
    </div>

    <div class="card" onclick="go('home-visits.html')">
      <div class="icon">🏠</div>
      <h3>الزيارات المنزلية</h3>
      <h4>Home Visits</h4>
    </div>

  </div>

</main>

<footer class="footer">
  مركز عكاز للعلاج الطبيعي © Akaz Physiotherapy Center
</footer>

<script>
function go(page){
  window.location.href = page;
}

function toggleTheme(){
  document.body.classList.toggle("dark");
  const isDark = document.body.classList.contains("dark");
  localStorage.setItem("akazTheme", isDark ? "dark" : "light");
  document.getElementById("themeBtn").innerText = isDark ? "☀️" : "🌙";
}

function loadTheme(){
  const saved = localStorage.getItem("akazTheme");
  if(saved === "dark"){
    document.body.classList.add("dark");
    document.getElementById("themeBtn").innerText = "☀️";
  }
}

function updateClock(){
  const now = new Date();

  document.getElementById("clockTime").innerText =
    now.toLocaleTimeString("en-GB");

  document.getElementById("clockDateAr").innerText =
    now.toLocaleDateString("ar-SA",{
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    });

  document.getElementById("clockDateEn").innerText =
    now.toLocaleDateString("en-GB",{
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    });
}

const quotes = [
  "نحن هنا لنخفف الألم ونصنع الفرق",
  "كل مريض يدخل… هو أمانة ومسؤولية",
  "هدفنا راحة المريض قبل كل شيء",
  "العلاج الحقيقي يبدأ بالاهتمام",
  "ابتسامتك للمريض جزء من العلاج",
  "كل جلسة فرصة لتغيير حياة",
  "ساعد المريض اليوم… واصنع أثرًا يبقى",
  "التعامل الإنساني هو أساس العلاج",
  "أنت سبب في عودة الأمل لمريض",
  "نحن لا نعالج فقط… نحن نعيد جودة الحياة",
  "راحة المريض هي نجاحك الحقيقي",
  "استمع للمريض… نصف العلاج في الفهم",
  "كل خطوة تقدمها للمريض لها قيمة",
  "العلاج مهارة… والإنسانية فن",
  "المريض يثق بك… لا تخذل ثقته",
  "كل يوم فرصة لمساعدة شخص على الوقوف مجددًا"
];

let quoteIndex = 0;

function rotateQuotes(){
  const el = document.getElementById("dailyQuote");
  el.style.opacity = 0;

  setTimeout(()=>{
    el.innerText = quotes[quoteIndex];
    el.style.opacity = 1;
    quoteIndex = (quoteIndex + 1) % quotes.length;
  },350);
}

loadTheme();
setInterval(updateClock,1000);
updateClock();

rotateQuotes();
setInterval(rotateQuotes,9000);
</script>

</body>
</html>
