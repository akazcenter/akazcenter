<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joint Replacement Assessment</title>

<link rel="icon" href="logo.png">

<style>
body{
  margin:0;
  font-family:Tahoma;
  background:#f6f9fc;
}

.topbar{
  background:#005b9f;
  color:#fff;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:1000px;
  margin:20px auto;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.title{
  font-weight:bold;
  color:#005b9f;
  margin-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

textarea{
  height:90px;
}

.result{
  background:#eef6ff;
  padding:12px;
  border-radius:12px;
  font-weight:bold;
  text-align:center;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  background:#005b9f;
  color:#fff;
  cursor:pointer;
}

.print{
  display:none;
}

@media print{
  body *{visibility:hidden}
  .print, .print *{visibility:visible}
  .print{
    display:block;
    position:absolute;
    top:0;
    width:100%;
  }
}
</style>
</head>

<body>

<div class="topbar">
تقييم ما بعد تبديل المفصل
</div>

<div class="container">

<div class="card">
<div class="title">بيانات المريض</div>

<div class="grid">
<input id="name" placeholder="اسم المريض">
<select id="type">
<option value="TKR">تبديل ركبة</option>
<option value="THR">تبديل ورك</option>
</select>

<input id="date" type="date">
<input id="weeks" placeholder="عدد الأسابيع">
</div>

</div>

<div class="card">
<div class="title">التقييم</div>

<div class="grid">

<select id="pain">
<option value="0">No Pain</option>
<option value="1">Mild Pain</option>
<option value="2">Moderate Pain</option>
<option value="3">Severe Pain</option>
</select>

<select id="swelling">
<option value="0">No Swelling</option>
<option value="1">Mild</option>
<option value="2">Moderate</option>
<option value="3">Severe</option>
</select>

<select id="rom">
<option value="2">Full</option>
<option value="1">Limited</option>
<option value="0">Poor</option>
</select>

<select id="walking">
<option value="2">Normal Walking</option>
<option value="1">With Difficulty</option>
<option value="0">Needs Support</option>
</select>

<select id="stairs">
<option value="2">Normal</option>
<option value="1">With Support</option>
<option value="0">Unable</option>
</select>

<select id="sit">
<option value="2">Easy</option>
<option value="1">With Effort</option>
<option value="0">Difficult</option>
</select>

</div>

</div>

<div class="card">
<div class="title">ملاحظات الأخصائي</div>
<textarea id="notes"></textarea>
</div>

<div class="card">
<div class="title">النتيجة</div>
<div class="result" id="score">0%</div>
</div>

<div class="card">
<button onclick="calc()">حساب</button>
</div>

<div class="card">
<button onclick="printReport()">طباعة التقرير</button>
</div>

</div>

<div class="print" id="printArea">

<h2 style="text-align:center">Post-Operative Functional Report</h2>

<p><b>Patient:</b> <span id="p_name"></span></p>
<p><b>Type:</b> <span id="p_type"></span></p>
<p><b>Date:</b> <span id="p_date"></span></p>

<hr>

<p><b>Score:</b> <span id="p_score"></span></p>

<p><b>Notes:</b></p>
<p id="p_notes"></p>

</div>

<script>

function calc(){

let total =
(+pain.value +
+swelling.value +
+rom.value +
+walking.value +
+stairs.value +
+sit.value);

let percent = Math.round((total/12)*100);

score.innerText = percent + "%";

}

function printReport(){

p_name.innerText = name.value;
p_type.innerText = type.value;
p_date.innerText = date.value;
p_score.innerText = score.innerText;
p_notes.innerText = notes.value;

window.print();

}

</script>

</body>
</html>
