<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول دوام الموظفين</title>

<style>
:root{
  --blue:#005b9f;
  --blue2:#0077c8;
  --dark:#073763;
  --orange:#f59e0b;
  --bg:#f3f7fb;
  --text:#0f172a;
  --muted:#64748b;
  --line:#d7dee8;
}

  .table-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.copy-btn{
  background:#e0f2fe;
  color:#075985;
  border:1px solid #bae6fd;
  padding:7px 13px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}
  
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  direction:rtl;
  background:linear-gradient(180deg,#f8fbff,#eef4f9);
  color:var(--text);
}

.header{
  background:linear-gradient(135deg,#004b87,#0077c8);
  color:white;
  padding:24px 4%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  box-shadow:0 14px 35px rgba(8,52,95,.22);
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  width:82px;
  height:82px;
  object-fit:contain;
  background:white;
  border-radius:22px;
  padding:8px;
  box-shadow:0 12px 26px rgba(0,0,0,.22);
}

.brand h1{
  margin:0;
  font-size:30px;
  font-weight:900;
}

.brand p{
  margin:5px 0 0;
  color:#dbeafe;
  font-size:14px;
}

.home-btn{
  background:white;
  color:var(--blue);
  border:none;
  padding:12px 20px;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.main{
  width:min(94%,1450px);
  margin:26px auto;
}

.controls{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:24px;
  padding:18px;
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  box-shadow:0 14px 35px rgba(15,23,42,.08);
}

.controls button{
  border:none;
  padding:13px 30px;
  border-radius:14px;
  background:#eef6ff;
  color:var(--blue);
  cursor:pointer;
  font-weight:900;
  font-size:15px;
  transition:.2s;
}

.controls button:hover,
.controls button.active{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  transform:translateY(-2px);
}

.section-title{
  text-align:center;
  color:var(--dark);
  margin:28px 0 20px;
  font-size:30px;
  font-weight:900;
}

.schedule-box{
  background:white;
  border-radius:26px;
  overflow:hidden;
  border:1px solid #e2e8f0;
  box-shadow:0 18px 42px rgba(15,23,42,.1);
  margin-bottom:28px;
}

.box-title{
  background:linear-gradient(135deg,var(--orange),#ffbd4a);
  color:white;
  padding:16px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.box-title h3{
  margin:0;
  font-size:22px;
  font-weight:900;
}

.clear-btn{
  background:#fff;
  color:#b91c1c;
  border:1px solid #fecaca;
  padding:9px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
}

th{
  background:var(--blue);
  color:white;
  padding:14px;
  font-size:16px;
  border:1px solid rgba(255,255,255,.18);
}

td{
  border:1px solid var(--line);
  padding:10px;
  text-align:center;
  background:white;
}

.shift-label{
  width:245px;
  background:#eef6ff;
  color:var(--dark);
  font-weight:bold;
}

.shift-name{
  display:block;
  color:var(--blue);
  font-size:22px;
  font-weight:900;
  margin-bottom:8px;
}

.shift-time{
  display:inline-block;
  direction:ltr;
  background:white;
  border:1px solid #dbeafe;
  border-radius:12px;
  padding:8px 12px;
  color:#334155;
  font-size:15px;
  line-height:1.8;
  font-weight:900;
}

.slot{
  margin-bottom:8px;
  border-radius:13px;
  padding:5px;
  transition:.2s;
}

select{
  width:100%;
  height:44px;
  border-radius:12px;
  border:1px solid #cbd5e1;
  font-size:15px;
  font-weight:bold;
  font-family:Tahoma,Arial;
  text-align:center;
  background:white;
  color:#0f172a;
  cursor:pointer;
}

.note{
  text-align:center;
  color:#64748b;
  margin:18px 0 0;
  font-weight:bold;
}

@media(max-width:800px){
  .header{
    flex-direction:column;
    text-align:center;
  }

  .brand{
    flex-direction:column;
  }

  .brand h1{
    font-size:23px;
  }

  .home-btn{
    width:100%;
  }

  .section-title{
    font-size:24px;
  }

  table{
    min-width:1100px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="brand">
    <img src="logo.png" class="logo" alt="شعار مركز عكاز">
    <div>
      <h1>جدول دوام الموظفين</h1>
      <p>Staff Work Schedule</p>
    </div>
  </div>

  <button class="home-btn" onclick="location.href='index.html'">🏠 الرئيسية</button>
</div>

<div class="main">

  <div class="controls">
    <button id="btn-men" class="active" onclick="switchSection('men')">قسم الرجال</button>
    <button id="btn-women" onclick="switchSection('women')">قسم النساء</button>
    <button id="btn-reception" onclick="switchSection('reception')">الاستقبال</button>
  </div>

  <h2 id="sectionTitle" class="section-title">قسم الرجال</h2>

  <div id="tablesArea"></div>

  <div class="note">أي تعديل يتم حفظه تلقائيًا ويظهر لجميع الموظفين</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyArYShiKgAnblA4aDEIr7zAM2q7oHbATJQ",
  authDomain: "akazcenter-89c17.firebaseapp.com",
  projectId: "akazcenter-89c17",
  storageBucket: "akazcenter-89c17.firebasestorage.app",
  messagingSenderId: "576111794528",
  appId: "1:576111794528:web:b7ee436f5bd0b60c4a6605"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const workRef = collection(db,"workSchedule");

let currentSection="men";
let savedData={};

const days=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];

const sectionTitles={
  men:"قسم الرجال",
  women:"قسم النساء",
  reception:"الاستقبال"
};

const shiftTimes={
  men:{
    single:"01:00 PM - 09:00 PM",
    split:"09:00 AM - 12:00 PM<br>04:00 PM - 08:00 PM"
  },
  women:{
    single:"12:00 PM - 08:00 PM",
    split:"09:00 AM - 12:00 PM<br>04:00 PM - 09:00 PM"
  },
  reception:{
    single:"12:00 PM - 08:00 PM",
    split:"09:00 AM - 12:00 PM<br>04:00 PM - 09:00 PM"
  }
};

const slotsCount={men:2,women:3,reception:1};

const employees={
  men:{
    "—":"#ffffff",
    "د. حاتم الاحمدي":"#c7d2fe",
    "د. عبدالرحمن السويداء":"#ddd6fe",
    "د. عبدالرحمن السليمي":"#fbcfe8",
    "د. عبدالعزيز الحمدان":"#fecaca"
  },
  women:{
    "—":"#ffffff",
    "د. ريناد حميد":"#fca5a5",
    "د. ابتسام سويلم":"#fdba74",
    "د. سلمى فرحان":"#fde68a",
    "د. هند فهيد":"#bbf7d0",
    "د. أسماء فهيد":"#a5f3fc",
    "د. مها فريح":"#bfdbfe"
  },
  reception:{
    "—":"#ffffff",
    "أ. مرام ناصر":"#bae6fd",
    "أ. أشواق سعود":"#bbf7d0",
    "أ. شهد خلف":"#fde68a"
  }
};

function makeId(section,shift,day,slot){
  return `${section}_${shift}_${day}_${slot}`.replaceAll(" ","_");
}

function renderTables(){
  const area=document.getElementById("tablesArea");
  area.innerHTML="";
  area.innerHTML+=buildTable("دوام شفت واحد","single","شفت واحد",shiftTimes[currentSection].single);
  area.innerHTML+=buildTable("دوام شفتين","split","شفتين",shiftTimes[currentSection].split);

  document.querySelectorAll("select").forEach(s=>colorCell(s));
}

function buildTable(title,shift,label,time){
  let html=`
  <div class="schedule-box">
    <div class="box-title">
      <h3>${title}</h3>
<div class="table-actions">
  <button class="copy-btn" onclick="copySaturday('${shift}')">نسخ الاسم لباقي الأسبوع</button>
  <button class="clear-btn" onclick="clearSchedule('${shift}')">🗑️ حذف هذا الجدول</button>
</div>    </div>
    <div class="table-wrap">
      <table>
        <tr><th>نوع الدوام</th>`;

  days.forEach(d=>html+=`<th>${d}</th>`);
  html+=`</tr><tr>
    <td class="shift-label">
      <span class="shift-name">${label}</span>
      <span class="shift-time">${time}</span>
    </td>`;

  days.forEach(day=>{
    html+=`<td>`;
    for(let i=0;i<slotsCount[currentSection];i++){
      const id=makeId(currentSection,shift,day,i);
      const value=savedData[id]?.employee || "—";
      html+=createSelect(id,value);
    }
    html+=`</td>`;
  });

  html+=`</tr></table></div></div>`;
  return html;
}

function createSelect(id,value){
  let opt="";
  for(let name in employees[currentSection]){
    opt+=`<option value="${name}" ${name===value?"selected":""}>${name}</option>`;
  }
  return `<div class="slot"><select data-id="${id}" onchange="save(this)">${opt}</select></div>`;
}

function colorCell(select){
  const wrapper=select.parentElement;
  const color=employees[currentSection][select.value] || "#ffffff";
  wrapper.style.background=color;

  if(select.value==="—"){
    wrapper.style.background="#ffffff";
    select.style.color="#0f172a";
  }else{
    select.style.color="#000";
    select.style.fontWeight="bold";
  }
}

function isDuplicateInSameDay(select){
  const selected=select.value;
  if(selected==="—") return false;

  const td=select.closest("td");
  const row=td.parentElement;
  const dayIndex=Array.from(row.children).indexOf(td);
  let count=0;

  document.querySelectorAll("table tr").forEach(r=>{
    const cells=r.children;
    if(cells.length>dayIndex){
      cells[dayIndex].querySelectorAll("select").forEach(s=>{
        if(s.value===selected) count++;
      });
    }
  });

  return count>1;
}

window.save=async function(el){
  const id=el.dataset.id;
  const val=el.value;

  if(isDuplicateInSameDay(el)){
    alert("هذا الاسم موجود مسبقًا في نفس اليوم");
    el.value="—";
    colorCell(el);
    await deleteDoc(doc(db,"workSchedule",id));
    return;
  }

  colorCell(el);

  if(val==="—"){
    await deleteDoc(doc(db,"workSchedule",id));
    return;
  }

  await setDoc(doc(db,"workSchedule",id),{
    id,
    section:currentSection,
    employee:val,
    updatedAt:new Date()
  });
};

window.clearSchedule=async function(shift){
  if(!confirm("متأكد تبغى تحذف هذا الجدول بالكامل؟")) return;

  const snap=await getDocs(workRef);
  const deletes=[];

  snap.forEach(item=>{
    if(item.id.includes(`${currentSection}_${shift}_`)){
      deletes.push(deleteDoc(doc(db,"workSchedule",item.id)));
    }
  });

  await Promise.all(deletes);
};

window.switchSection=function(sec){
  currentSection=sec;

  document.getElementById("sectionTitle").innerText=sectionTitles[sec];

  document.querySelectorAll(".controls button").forEach(btn=>btn.classList.remove("active"));
  document.getElementById("btn-"+sec).classList.add("active");

  renderTables();
};

onSnapshot(workRef,(snap)=>{
  savedData={};
  snap.forEach(d=>{
    savedData[d.id]=d.data();
  window.copySaturday = async function(shift){
  if(!confirm("نسخ أسماء يوم السبت لباقي أيام الأسبوع؟")) return;

  const saturday = "السبت";
  const otherDays = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
  const writes = [];

  for(let i=0; i<slotsCount[currentSection]; i++){
    const saturdayId = makeId(currentSection, shift, saturday, i);
    const employee = savedData[saturdayId]?.employee || "—";

    for(const day of otherDays){
      const targetId = makeId(currentSection, shift, day, i);

      if(employee === "—"){
        writes.push(deleteDoc(doc(db,"workSchedule",targetId)));
      }else{
        writes.push(setDoc(doc(db,"workSchedule",targetId),{
          id:targetId,
          section:currentSection,
          employee,
          updatedAt:new Date()
        }));
      }
    }
  }

  await Promise.all(writes);
};
  renderTables();
});
</script>

</body>
</html>
