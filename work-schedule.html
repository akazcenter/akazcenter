<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول دوام الموظفين</title>

<style>
body{margin:0;font-family:Tahoma,Arial;direction:rtl;background:#f1f5f9;color:#0f172a}
.topbar{background:linear-gradient(135deg,#005b9f,#0077c8);color:white;padding:18px 28px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:70px;height:70px;background:white;border-radius:16px;padding:7px}
.home-btn{background:white;color:#005b9f;border:none;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:bold}
.controls{display:flex;justify-content:center;gap:12px;margin:20px}
.controls button{padding:10px 20px;border:none;background:#005b9f;color:white;border-radius:10px;cursor:pointer}
.section-title{text-align:center;color:#005b9f;margin:10px}
.schedule-box{width:96%;margin:20px auto;background:white;border-radius:18px;box-shadow:0 6px 20px #0001}
.box-title{background:#f59e0b;color:white;padding:12px;font-size:18px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.clear-btn{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:bold}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:#005b9f;color:white;padding:10px}
td{border:1px solid #ddd;padding:6px;text-align:center}
.shift-label{background:#eef6ff;font-weight:bold}
.slot{margin-bottom:6px;border-radius:6px}
select{width:95%;height:38px;border-radius:6px;font-weight:bold}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">
    <img src="logo.png" class="logo">
    <h2>جدول دوام الموظفين</h2>
  </div>
  <button class="home-btn" onclick="location.href='index.html'">الرئيسية</button>
</div>

<div class="controls">
  <button onclick="switchSection('men')">رجال</button>
  <button onclick="switchSection('women')">نساء</button>
  <button onclick="switchSection('reception')">استقبال</button>
</div>

<h2 id="sectionTitle" class="section-title">قسم الرجال</h2>

<div id="tablesArea"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyArYShiKgAnblA4aDEIr7zAM2q7oHbATJQ",
  authDomain: "akazcenter-89c17.firebaseapp.com",
  projectId: "akazcenter-89c17",
  storageBucket: "akazcenter-89c17.firebasestorage.app",
  messagingSenderId: "576111794528",
  appId: "1:576111794528:web:b7ee436f5bd0b60c4a6605"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const workRef = collection(db,"workSchedule");

let currentSection="men";
let savedData={};

const days=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];

const sectionTitles={
  men:"قسم الرجال",
  women:"قسم النساء",
  reception:"الاستقبال"
};

const slotsCount={men:2,women:3,reception:1};

const employees={
  men:["—","حاتم","السويداء","السليمي","عبدالعزيز"],
  women:["—","ريناد","ابتسام","سلمى","هند","أسماء","مها"],
  reception:["—","مرام","أشواق","شهد"]
};

function makeId(section,shift,day,slot){
  return `${section}_${shift}_${day}_${slot}`;
}

function renderTables(){
  const area=document.getElementById("tablesArea");
  area.innerHTML="";
  area.innerHTML+=buildTable("شفت واحد","single");
  area.innerHTML+=buildTable("شفتين","split");
}

function buildTable(title,shift){
  let html=`<div class="schedule-box">
  <div class="box-title">
    ${title}
    <button class="clear-btn" onclick="clearSchedule('${shift}')">🗑️ حذف</button>
  </div>
  <div class="table-wrap">
  <table><tr><th>الشفت</th>`;

  days.forEach(d=>html+=`<th>${d}</th>`);
  html+=`</tr><tr><td class="shift-label">${title}</td>`;

  days.forEach(day=>{
    html+=`<td>`;
    for(let i=0;i<slotsCount[currentSection];i++){
      const id=makeId(currentSection,shift,day,i);
      const value=savedData[id]?.employee||"—";
      html+=createSelect(id,value);
    }
    html+=`</td>`;
  });

  html+=`</tr></table></div></div>`;
  return html;
}

function createSelect(id,value){
  let opt="";
  employees[currentSection].forEach(n=>{
    opt+=`<option ${n===value?"selected":""}>${n}</option>`;
  });
  return `<div class="slot"><select data-id="${id}" onchange="save(this)">${opt}</select></div>`;
}

window.save=async function(el){
  const id=el.dataset.id;
  const val=el.value;

  if(val==="—"){
    await deleteDoc(doc(db,"workSchedule",id));
    return;
  }

  await setDoc(doc(db,"workSchedule",id),{
    id,
    section:currentSection,
    employee:val
  });
};

window.clearSchedule=async function(shift){
  if(!confirm("متأكد؟")) return;

  const snap=await getDocs(workRef);

  const deletes=[];
  snap.forEach(docu=>{
    if(docu.id.includes(currentSection+"_"+shift)){
      deletes.push(deleteDoc(doc(db,"workSchedule",docu.id)));
    }
  });

  await Promise.all(deletes);
};

window.switchSection=function(sec){
  currentSection=sec;
  document.getElementById("sectionTitle").innerText=sectionTitles[sec];
  renderTables();
};

onSnapshot(workRef,(snap)=>{
  savedData={};
  snap.forEach(d=>{
    savedData[d.id]=d.data();
  });
  renderTables();
});
</script>

</body>
</html>
