<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>جدول دوام الموظفين</title>

<style>
body {
    font-family: Tahoma, Arial;
    direction: rtl;
    background: #eef3f8;
    margin: 0;
}

.header {
    background: #005b9f;
    color: white;
    padding: 18px 30px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.home-btn {
    position: absolute;
    top: 15px;
    left: 20px;
    background: white;
    color: #005b9f;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px;
    flex-wrap: wrap;
}

button {
    padding: 10px 25px;
    border: none;
    background: #005b9f;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #00457a;
}

.section-title {
    text-align: center;
    color: #005b9f;
}

.table-wrap {
    width: 96%;
    margin: auto;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th {
    background: #005b9f;
    color: white;
    padding: 10px;
}

td {
    border: 1px solid #ccc;
    height: 58px;
    text-align: center;
}

.time {
    background: #dbeafe;
    font-weight: bold;
    width: 170px;
}

select {
    width: 96%;
    height: 42px;
    border-radius: 7px;
    border: 1px solid #94a3b8;
    font-size: 16px;
    font-weight: bold;
    font-family: Tahoma, Arial;
    text-align: center;
    background: white;
    color: #0f172a;
}

.note {
    text-align: center;
    color: #b91c1c;
    font-weight: bold;
    margin: 18px;
}
</style>
</head>

<body>

<button onclick="goHome()" class="home-btn">🏠 الرئيسية</button>

<div class="header">جدول دوام الموظفين</div>

<div class="controls">
    <button onclick="switchSection('men')">قسم الرجال</button>
    <button onclick="switchSection('women')">قسم النساء</button>
    <button onclick="switchSection('reception')">الاستقبال</button>
</div>

<h2 id="sectionTitle" class="section-title">قسم الرجال</h2>

<div class="table-wrap">
    <table id="schedule"></table>
</div>

<div class="note">
    يتم تحديث جدول الدوام أسبوعيًا حسب احتياج القسم
</div>

<script>
function goHome() {
    window.location.href = "index.html";
}

let currentSection = "men";

const days = ["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];

const shifts = {
    men: [
        "09:00 AM - 01:00 PM",
        "04:00 PM - 08:00 PM",
        "01:00 PM - 09:00 PM"
    ],
    women: [
        "09:00 AM - 12:00 PM",
        "04:00 PM - 09:00 PM",
        "12:00 PM - 08:00 PM"
    ],
    reception: [
        "09:00 AM - 12:00 PM",
        "04:00 PM - 09:00 PM",
        "12:00 PM - 08:00 PM"
    ]
};

const employees = {
    men: {
        "—": "#ffffff",
        "د. حاتم الاحمدي": "#c7d2fe",
        "د. عبدالرحمن السويداء": "#ddd6fe",
        "د. عبدالرحمن السليمي": "#fbcfe8",
        "د. عبدالعزيز الحمدان": "#fecaca"
    },
    women: {
        "—": "#ffffff",
        "د. ريناد حميد": "#fca5a5",
        "د. ابتسام سويلم": "#fdba74",
        "د. سلمى فرحان": "#fde68a",
        "د. هند فهيد": "#bbf7d0",
        "د. أسماء فهيد": "#a5f3fc",
        "د. مها فريح": "#bfdbfe"
    },
    reception: {
        "—": "#ffffff",
        "موظف استقبال 1": "#bae6fd",
        "موظف استقبال 2": "#bbf7d0",
        "موظف استقبال 3": "#fde68a"
    }
};

function buildTable() {
    let table = document.getElementById("schedule");
    table.innerHTML = "";

    let header = "<tr><th>وقت الدوام</th>";
    days.forEach(day => header += `<th>${day}</th>`);
    header += "</tr>";
    table.innerHTML += header;

    shifts[currentSection].forEach(shift => {
        let row = `<tr><td class="time">${shift}</td>`;

        days.forEach(() => {
            row += `<td>${createDropdown()}</td>`;
        });

        row += "</tr>";
        table.innerHTML += row;
    });
}

function createDropdown() {
    let options = "";
    for (let name in employees[currentSection]) {
        options += `<option value="${name}">${name}</option>`;
    }

    return `<select onchange="colorCell(this)">${options}</select>`;
}

function colorCell(select) {
    const color = employees[currentSection][select.value];
    const cell = select.parentElement;

    cell.style.background = color;

    if (select.value !== "—") {
        select.style.fontWeight = "bold";
        select.style.color = "#000";
    } else {
        cell.style.background = "#ffffff";
        select.style.color = "#0f172a";
    }
}

function switchSection(section) {
    currentSection = section;

    const titles = {
        men: "قسم الرجال",
        women: "قسم النساء",
        reception: "الاستقبال"
    };

    document.getElementById("sectionTitle").innerText = titles[section];
    buildTable();
}

buildTable();
</script>

</body>
</html>
