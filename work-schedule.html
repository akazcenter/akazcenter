<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>جدول دوام الموظفين</title>

<style>
body {
    font-family: Tahoma, Arial;
    direction: rtl;
    background: #eef3f8;
    margin: 0;
}

.header {
    background: #005b9f;
    color: white;
    padding: 18px 30px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.home-btn {
    position: absolute;
    top: 15px;
    left: 20px;
    background: white;
    color: #005b9f;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 22px;
    flex-wrap: wrap;
}

button {
    padding: 10px 26px;
    border: none;
    background: #005b9f;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #00457a;
}

.section-title {
    text-align: center;
    color: #005b9f;
    margin-bottom: 20px;
}

.schedule-box {
    width: 96%;
    margin: 25px auto;
    background: white;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    overflow: hidden;
}

.box-title {
    background: #f59e0b;
    color: white;
    padding: 12px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #005b9f;
    color: white;
    padding: 11px;
}

td {
    border: 1px solid #cbd5e1;
    height: 58px;
    text-align: center;
}

.shift-label {
    background: #dbeafe;
    font-weight: bold;
    width: 200px;
}

.shift-time {
    display: block;
    font-size: 14px;
    color: #334155;
    margin-top: 4px;
}

select {
    width: 96%;
    height: 42px;
    border-radius: 7px;
    border: 1px solid #94a3b8;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
}
</style>
</head>

<body>

<button onclick="goHome()" class="home-btn">🏠 الرئيسية</button>

<div class="header">جدول دوام الموظفين</div>

<div class="controls">
    <button onclick="switchSection('men')">قسم الرجال</button>
    <button onclick="switchSection('women')">قسم النساء</button>
    <button onclick="switchSection('reception')">الاستقبال</button>
</div>

<h2 id="sectionTitle" class="section-title">قسم الرجال</h2>

<div id="tablesArea"></div>

<script>

function preventDuplicate(select) {
    const selectedName = select.value;

    if (selectedName === "—") {
        colorCell(select);
        return;
    }

    const currentCell = select.closest("td");
    const row = currentCell.parentElement;
    const cellIndex = Array.from(row.children).indexOf(currentCell);

    const allTables = document.querySelectorAll("table");

    let count = 0;

    allTables.forEach(table => {
        const rows = table.querySelectorAll("tr");

        rows.forEach((r, rowIndex) => {
            if (rowIndex === 0) return;

            const cells = r.children;
            const sameDayCell = cells[cellIndex];

            if (sameDayCell) {
                const selects = sameDayCell.querySelectorAll("select");

                selects.forEach(s => {
                    if (s.value === selectedName) {
                        count++;
                    }
                });
            }
        });
    });

    if (count > 1) {
        alert("هذا الاسم مختار مسبقًا في نفس اليوم");
        select.value = "—";
    }

    colorCell(select);
}
function goHome() {
    window.location.href = "index.html";
}

let currentSection = "men";

const days = ["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];

const sectionTitles = {
    men: "قسم الرجال",
    women: "قسم النساء",
    reception: "الاستقبال"
};

const shiftSettings = {
    men: {
        single: "01:00 PM - 09:00 PM",
        splitFirst: "09:00 AM - 01:00 PM",
        splitSecond: "04:00 PM - 08:00 PM"
    },
    women: {
        single: "12:00 PM - 08:00 PM",
        splitFirst: "09:00 AM - 12:00 PM",
        splitSecond: "04:00 PM - 09:00 PM"
    },
    reception: {
        single: "12:00 PM - 08:00 PM",
        splitFirst: "09:00 AM - 12:00 PM",
        splitSecond: "04:00 PM - 09:00 PM"
    }
};

const employees = {
    men: {
        "—": "#ffffff",
        "د. حاتم الاحمدي": "#c7d2fe",
        "د. عبدالرحمن السويداء": "#ddd6fe",
        "د. عبدالرحمن السليمي": "#fbcfe8",
        "د. عبدالعزيز الحمدان": "#fecaca"
    },
    women: {
        "—": "#ffffff",
        "د. ريناد حميد": "#fca5a5",
        "د. ابتسام سويلم": "#fdba74",
        "د. سلمى فرحان": "#fde68a",
        "د. هند فهيد": "#bbf7d0",
        "د. أسماء فهيد": "#a5f3fc",
        "د. مها فريح": "#bfdbfe"
    },
    reception: {
        "—": "#ffffff",
        "موظف استقبال 1": "#bae6fd",
        "موظف استقبال 2": "#bbf7d0",
        "موظف استقبال 3": "#fde68a"
    }
};

function renderAllTables() {
    const area = document.getElementById("tablesArea");
    area.innerHTML = "";

    area.innerHTML += buildTable("دوام شفت واحد", [
        { 
            label: "شفت واحد", 
            time: shiftSettings[currentSection].single 
        }
    ]);

    area.innerHTML += buildTable("دوام شفتين", [
        { 
            label: "شفتين", 
            time: shiftSettings[currentSection].splitFirst + " / " + shiftSettings[currentSection].splitSecond
        }
    ]);
}
function buildTable(title, rows) {
    let slots = {
        men: 2,
        women: 3,
        reception: 1
    };

    let html = `
    <div class="schedule-box">
        <div class="box-title">${title}</div>
        <div class="table-wrap">
            <table>
                <tr>
                    <th>نوع الشفت</th>
    `;

    days.forEach(day => html += `<th>${day}</th>`);
    html += "</tr>";

    rows.forEach(row => {
        html += `
        <tr>
            <td class="shift-label">
                ${row.label}
                <span class="shift-time">${row.time}</span>
            </td>
        `;

        days.forEach(() => {
            html += `<td>`;

            for (let i = 0; i < slots[currentSection]; i++) {
                html += `
                <div style="margin-bottom:5px;">
                    ${createDropdown()}
                </div>`;
            }

            html += `</td>`;
        });

        html += "</tr>";
    });

    html += `
            </table>
        </div>
    </div>`;

    return html;
}
function createDropdown() {
    let options = "";
    for (let name in employees[currentSection]) {
        options += `<option value="${name}">${name}</option>`;
    }

return `<select onchange="preventDuplicate(this)">${options}</select>`;}

function colorCell(select) {
    const color = employees[currentSection][select.value];
    const cell = select.parentElement;

    cell.style.background = color;
}

function switchSection(section) {
    currentSection = section;
    document.getElementById("sectionTitle").innerText = sectionTitles[section];
    renderAllTables();
}

renderAllTables();

</script>

</body>
</html>
