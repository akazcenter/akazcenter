<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Rehab Progress</title>
<link rel="icon" href="logo.png">

<style>
:root{
  --blue:#005b9f;--blue2:#0077c8;--orange:#f59e0b;
  --text:#0f172a;--line:#e2e8f0;
  --green:#166534;--yellow:#92400e;--red:#b91c1c;
}
body{margin:0;font-family:Tahoma;background:#f4f8fc}
.topbar{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;padding:18px;display:flex;justify-content:space-between
}
.home-btn{background:white;color:var(--blue);border:none;padding:10px;border-radius:10px;cursor:pointer}

.main{width:92%;max-width:1100px;margin:25px auto}

.card{
  background:white;border-radius:20px;padding:20px;margin-bottom:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.08)
}

h2{color:var(--blue)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

input,select,textarea{
  width:100%;padding:10px;border-radius:10px;border:1px solid #ccc
}

.result{
  text-align:center;font-size:40px;font-weight:bold;color:var(--blue)
}

.badge{
  padding:8px 15px;border-radius:999px;font-weight:bold
}
.good{background:#dcfce7;color:var(--green)}
.mid{background:#fef3c7;color:var(--yellow)}
.bad{background:#fee2e2;color:var(--red)}

button{
  padding:12px;border:none;border-radius:12px;font-weight:bold;cursor:pointer
}
.primary{background:var(--blue);color:white}
.secondary{background:#eef6ff;color:var(--blue)}
</style>
</head>

<body>

<div class="topbar">
  <h3>تقييم تأهيلي عام</h3>
  <button class="home-btn" onclick="location.href='functional-assessments.html'">رجوع</button>
</div>

<div class="main">

<div class="card">
<h2>بيانات المريض</h2>
<div class="grid">
<input id="name" placeholder="اسم المريض">
<input id="condition" placeholder="نوع الحالة">
<input id="therapist" placeholder="الأخصائي">
<input type="date" id="date">
</div>
</div>

<div class="card">
<h2>التقييم العام</h2>
<div class="grid">
<input type="number" id="pain" placeholder="Pain 0-10" oninput="calc()">
<input type="number" id="rom" placeholder="ROM %" oninput="calc()">
<input type="number" id="strength" placeholder="Strength %" oninput="calc()">
<input type="number" id="function" placeholder="Function %" oninput="calc()">
<input type="number" id="balance" placeholder="Balance %" oninput="calc()">
<input type="number" id="confidence" placeholder="Confidence 0-10" oninput="calc()">
</div>
</div>

<div class="card">
<h2>ملاحظات</h2>
<textarea id="notes"></textarea>
</div>

<div class="card">
<h2>النتيجة</h2>
<div class="result" id="score">0%</div>
<div id="status" class="badge bad">Needs Rehab</div>
</div>

<div class="card">
<button class="primary" onclick="printReport()">طباعة التقرير</button>
<button class="secondary" onclick="calc()">تحديث</button>
</div>

</div>

<script>
function calc(){
  let pain = document.getElementById("pain").value || 0;
  let rom = document.getElementById("rom").value || 0;
  let strength = document.getElementById("strength").value || 0;
  let functionVal = document.getElementById("function").value || 0;
  let balance = document.getElementById("balance").value || 0;
  let confidence = document.getElementById("confidence").value || 0;

  let painScore = (10 - pain) * 10;
  let confScore = confidence * 10;

  let avg = (painScore + rom + strength + functionVal + balance + confScore) / 6;

  avg = Math.round(avg);

  document.getElementById("score").innerText = avg + "%";

  let status = document.getElementById("status");

  if(avg >= 90){
    status.innerText = "Excellent";
    status.className = "badge good";
  }else if(avg >= 75){
    status.innerText = "Good";
    status.className = "badge mid";
  }else{
    status.innerText = "Needs Rehab";
    status.className = "badge bad";
  }
}

function printReport(){
  window.print();
}

calc();
</script>

</body>
</html>
